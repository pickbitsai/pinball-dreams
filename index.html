<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pinball Alley</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        #score-display {
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            border: 3px solid #4a4a6a;
            border-radius: 10px 10px 0 0;
            padding: 10px 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-item { text-align: center; }
        .score-label { color: #8888aa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .score-value { color: #00ff88; font-size: 24px; font-weight: bold; font-family: 'Courier New', monospace; }
        #high-score .score-value { color: #ffcc00; }
        #balls-left .score-value { color: #ff6688; }
        #game-canvas { border: 3px solid #4a4a6a; border-top: none; border-radius: 0 0 10px 10px; }

        .score-popup {
            position: absolute; color: #ffcc00; font-size: 20px; font-weight: bold;
            pointer-events: none; animation: scoreFloat 1s ease-out forwards; z-index: 100;
        }
        @keyframes scoreFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        #game-over, #level-select {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95); padding: 25px; border-radius: 20px;
            text-align: center; z-index: 200; border: 3px solid #4a4a6a;
        }
        #game-over { display: none; border-color: #ff6688; }
        #game-over h2 { color: #ff6688; font-size: 32px; margin-bottom: 15px; }
        #final-score { color: #00ff88; font-size: 28px; font-weight: bold; margin: 15px 0; }
        #level-select h2 { color: #00ff88; font-size: 24px; margin-bottom: 15px; }

        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .level-btn {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border: 2px solid #4a4a6a; padding: 12px 8px; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; min-width: 130px;
        }
        .level-btn:hover, .level-btn.selected { border-color: #00ff88; transform: scale(1.05); }
        .level-btn .level-name { color: #fff; font-size: 14px; font-weight: bold; display: block; margin-bottom: 3px; }
        .level-btn .level-desc { color: #8888aa; font-size: 10px; }
        .level-btn .level-icon { font-size: 20px; margin-bottom: 3px; }

        #restart-btn, #play-btn, #menu-btn {
            background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%);
            border: none; padding: 12px 35px; font-size: 18px; font-weight: bold;
            color: #1a1a2e; border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        #restart-btn:hover, #play-btn:hover, #menu-btn:hover { transform: scale(1.1); }

        #menu-btn {
            position: absolute; top: 55px; left: 10px; padding: 8px 15px; font-size: 14px;
            background: linear-gradient(180deg, #ff6688 0%, #cc4466 100%); z-index: 100;
            display: none;
        }

        #instructions { color: #8888aa; font-size: 11px; margin-top: 10px; text-align: center; }
        #instructions span { color: #ffcc00; }
        .touch-zone { position: absolute; bottom: 0; width: 50%; height: 100%; z-index: 50; pointer-events: none; }
        #touch-left { left: 0; }
        #touch-right { right: 0; }
        .touch-active { background: radial-gradient(ellipse at bottom, rgba(255, 102, 136, 0.3) 0%, transparent 70%); }
        #launch-indicator {
            position: absolute; bottom: 15px; right: 15px; color: #00ff88;
            font-size: 12px; animation: pulse 1s infinite; display: none;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #level-name-display {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            color: #ffcc00; font-size: 12px; font-weight: bold; opacity: 0.8;
        }
        #editor-controls {
            position: absolute; top: 55px; right: 10px; display: none; z-index: 100;
            flex-direction: column; gap: 5px;
        }
        .editor-btn {
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            border: none; padding: 8px 12px; font-size: 12px; font-weight: bold;
            color: #fff; border-radius: 8px; cursor: pointer;
        }
        .editor-btn.active { background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%); color: #1a1a2e; }
        .editor-btn.danger { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); }
        #editor-instructions {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            color: #ffcc00; font-size: 11px; text-align: center; display: none;
            background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px;
        }
        #board-selector {
            position: absolute; top: 55px; left: 10px; display: none; z-index: 100;
            flex-direction: column; gap: 3px;
        }
        .board-btn {
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            border: 2px solid #4b5563; padding: 6px 10px; font-size: 11px; font-weight: bold;
            color: #9ca3af; border-radius: 6px; cursor: pointer;
        }
        .board-btn.active { background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); color: #1a1a2e; border-color: #fbbf24; }
        .board-btn:hover { border-color: #fbbf24; }
        #add-board-btn { color: #00ff88; border-color: #00ff88; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">
            <div class="score-item" id="high-score">
                <div class="score-label">High Score</div>
                <div class="score-value">0</div>
            </div>
            <div class="score-item" id="current-score">
                <div class="score-label">Score</div>
                <div class="score-value">0</div>
            </div>
            <div class="score-item" id="balls-left">
                <div class="score-label">Balls</div>
                <div class="score-value">3</div>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <button id="menu-btn">MENU</button>
        <div id="touch-left" class="touch-zone"></div>
        <div id="touch-right" class="touch-zone"></div>
        <div id="launch-indicator">Tap to Launch!</div>
        <div id="level-name-display"></div>
        <div id="editor-controls">
            <button class="editor-btn active" id="bumper-mode-btn">+ Bumper</button>
            <button class="editor-btn" id="flipper-mode-btn">+ Flipper</button>
            <button class="editor-btn" id="portal-mode-btn">+ Portal</button>
            <button class="editor-btn" id="wall-mode-btn">Draw Wall</button>
            <button class="editor-btn" id="play-test-btn">Play Test</button>
            <button class="editor-btn danger" id="clear-btn">Clear Board</button>
        </div>
        <div id="board-selector">
            <button class="board-btn active" data-board="0">Main</button>
            <button class="board-btn" data-board="1">Upper 1</button>
            <button class="board-btn" data-board="2">Upper 2</button>
            <button class="board-btn" id="add-board-btn">+</button>
        </div>
        <div id="editor-instructions">Tap to place bumpers | Draw to create walls</div>

        <div id="level-select">
            <h2>SELECT LEVEL</h2>
            <div class="level-grid">
                <button class="level-btn selected" data-level="0">
                    <div class="level-icon">🎯</div>
                    <span class="level-name">Classic</span>
                    <span class="level-desc">Traditional layout</span>
                </button>
                <button class="level-btn" data-level="1">
                    <div class="level-icon">🌀</div>
                    <span class="level-name">Vortex</span>
                    <span class="level-desc">Spiral madness</span>
                </button>
                <button class="level-btn" data-level="2">
                    <div class="level-icon">💎</div>
                    <span class="level-name">Diamond</span>
                    <span class="level-desc">Gem patterns</span>
                </button>
                <button class="level-btn" data-level="3">
                    <div class="level-icon">🏰</div>
                    <span class="level-name">Castle</span>
                    <span class="level-desc">Tower defense</span>
                </button>
                <button class="level-btn" data-level="4">
                    <div class="level-icon">🌊</div>
                    <span class="level-name">Wave</span>
                    <span class="level-desc">Curved chaos</span>
                </button>
                <button class="level-btn" data-level="5">
                    <div class="level-icon">🎨</div>
                    <span class="level-name">Custom</span>
                    <span class="level-desc">Build your own!</span>
                </button>
                <button class="level-btn" data-level="6">
                    <div class="level-icon">🎲</div>
                    <span class="level-name">Infinite</span>
                    <span class="level-desc">Endless rogue-like!</span>
                </button>
            </div>
            <button id="play-btn">PLAY</button>
        </div>

        <div id="game-over">
            <h2>GAME OVER</h2>
            <p style="color:#fff">Final Score:</p>
            <div id="final-score">0</div>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>
    <div id="instructions">
        <span>Desktop:</span> A/D for flippers | Space to launch |
        <span>Mobile:</span> Tap sides for flippers
    </div>

    <script>
        const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;

        const CONFIG = {
            width: 400, height: 700,
            ball: { radius: 10, restitution: 0.5, friction: 0.001, frictionAir: 0.0005, density: 0.0015 },
            flipper: { restAngle: 0.5, activeAngle: -0.5 },
            totalBalls: 3
        };

        const LEVELS = [
            { name: "Classic", theme: { bg: '#1a1a2e', wall: '#4a5568', bumper: '#00ccff', accent: '#ff6688' } },
            { name: "Vortex", theme: { bg: '#0a0a1a', wall: '#6366f1', bumper: '#a855f7', accent: '#22d3ee' } },
            { name: "Diamond", theme: { bg: '#1a2e2a', wall: '#2dd4bf', bumper: '#34d399', accent: '#fbbf24' } },
            { name: "Castle", theme: { bg: '#2e1a0a', wall: '#b45309', bumper: '#fbbf24', accent: '#ef4444' } },
            { name: "Wave", theme: { bg: '#1e1b4b', wall: '#7c3aed', bumper: '#c084fc', accent: '#fb7185' } },
            { name: "Custom", theme: { bg: '#1a1a2e', wall: '#22d3ee', bumper: '#f472b6', accent: '#a78bfa' } }
        ];

        // Multi-board custom level system
        // Each board has its own bumpers, flippers, portals, walls
        let customBoards = [
            { name: 'Main', bumpers: [], flippers: [], portals: [], walls: [] },
            { name: 'Upper 1', bumpers: [], flippers: [], portals: [], walls: [] },
            { name: 'Upper 2', bumpers: [], flippers: [], portals: [], walls: [] }
        ];
        let currentBoard = 0; // Which board we're editing/viewing
        let activeBoardInPlay = 0; // Which board the ball is currently on

        // Shorthand references to current board's data (updated when board changes)
        let customBumpers = customBoards[0].bumpers;
        let customFlippers = customBoards[0].flippers;
        let customRamps = customBoards[0].portals;  // portals renamed from ramps
        let customWalls = customBoards[0].walls;

        // Editor state
        let editorMode = 'bumper'; // 'bumper', 'flipper', 'portal', 'wall', 'play'
        let isEditing = false;
        let currentDrawing = [];
        let isDrawing = false;
        let draggedBumper = null;
        let draggedFlipper = null;
        let draggedPortal = null;
        let customFlipperBodies = []; // Store flipper physics bodies for current board

        // Progression mode state
        let progressionMode = false;
        let progressionLevel = 0;
        let progressionDifficulty = 1.0;
        let progressionScore = 0;

        // Random level generator
        function generateRandomBoard(difficulty) {
            const board = { name: `Level ${progressionLevel + 1}`, bumpers: [], flippers: [], portals: [], walls: [] };

            // Number of elements scales with difficulty
            const numBumpers = Math.floor(3 + difficulty * 2 + Math.random() * 3);
            const numFlippers = Math.random() < 0.3 + difficulty * 0.1 ? Math.floor(Math.random() * 2) + 1 : 0;
            const numPortals = Math.random() < 0.4 ? 1 : 0; // Chance for portal to next level
            const numWalls = Math.floor(Math.random() * (2 + difficulty));

            // Generate bumpers in interesting patterns
            const patterns = ['scattered', 'triangle', 'diamond', 'spiral', 'grid'];
            const pattern = patterns[Math.floor(Math.random() * patterns.length)];

            const safeZoneTop = 80;
            const safeZoneBottom = CONFIG.height - 150;
            const safeZoneLeft = 60;
            const safeZoneRight = CONFIG.width - 80;

            if (pattern === 'scattered') {
                for (let i = 0; i < numBumpers; i++) {
                    board.bumpers.push({
                        x: safeZoneLeft + Math.random() * (safeZoneRight - safeZoneLeft),
                        y: safeZoneTop + Math.random() * (safeZoneBottom - safeZoneTop - 100),
                        radius: 18 + Math.random() * 12
                    });
                }
            } else if (pattern === 'triangle') {
                const cx = CONFIG.width / 2 - 20;
                const cy = 200;
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col <= row; col++) {
                        board.bumpers.push({
                            x: cx - row * 30 + col * 60,
                            y: cy + row * 60,
                            radius: 20 + Math.random() * 8
                        });
                    }
                }
            } else if (pattern === 'diamond') {
                const cx = CONFIG.width / 2 - 20;
                const positions = [
                    { x: 0, y: -80 }, { x: -60, y: 0 }, { x: 60, y: 0 },
                    { x: 0, y: 80 }, { x: -60, y: 160 }, { x: 60, y: 160 }, { x: 0, y: 240 }
                ];
                positions.slice(0, numBumpers).forEach(p => {
                    board.bumpers.push({ x: cx + p.x, y: 150 + p.y, radius: 20 + Math.random() * 8 });
                });
            } else if (pattern === 'spiral') {
                const cx = CONFIG.width / 2 - 20;
                const cy = 250;
                for (let i = 0; i < numBumpers; i++) {
                    const angle = (i / numBumpers) * Math.PI * 2;
                    const r = 40 + i * 20;
                    board.bumpers.push({
                        x: cx + Math.cos(angle) * r,
                        y: cy + Math.sin(angle) * r * 0.7,
                        radius: 18 + Math.random() * 10
                    });
                }
            } else if (pattern === 'grid') {
                const cols = 3;
                const rows = Math.ceil(numBumpers / cols);
                for (let i = 0; i < numBumpers; i++) {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    board.bumpers.push({
                        x: 100 + col * 80 + (row % 2) * 40,
                        y: 120 + row * 70,
                        radius: 20 + Math.random() * 8
                    });
                }
            }

            // Generate extra flippers at random positions
            for (let i = 0; i < numFlippers; i++) {
                const isLeft = Math.random() < 0.5;
                board.flippers.push({
                    x: isLeft ? 80 + Math.random() * 60 : CONFIG.width - 140 + Math.random() * 60,
                    y: 300 + Math.random() * 150,
                    side: isLeft ? 'left' : 'right'
                });
            }

            // Generate portal (chance to go to next level)
            if (numPortals > 0) {
                board.portals.push({
                    x: 80 + Math.random() * (CONFIG.width - 180),
                    y: 100 + Math.random() * 150
                });
            }

            // Generate random walls/deflectors
            for (let i = 0; i < numWalls; i++) {
                const wallType = Math.random();
                if (wallType < 0.5) {
                    // Angled deflector
                    const startX = 80 + Math.random() * (CONFIG.width - 180);
                    const startY = 200 + Math.random() * 200;
                    const angle = (Math.random() - 0.5) * 1.2;
                    const len = 40 + Math.random() * 40;
                    board.walls.push([
                        { x: startX, y: startY },
                        { x: startX + Math.cos(angle) * len, y: startY + Math.sin(angle) * len }
                    ]);
                } else {
                    // Curved wall
                    const startX = 80 + Math.random() * (CONFIG.width - 180);
                    const startY = 200 + Math.random() * 150;
                    const points = [{ x: startX, y: startY }];
                    for (let j = 0; j < 2 + Math.floor(Math.random() * 2); j++) {
                        const lastPt = points[points.length - 1];
                        points.push({
                            x: lastPt.x + (Math.random() - 0.5) * 60,
                            y: lastPt.y + 30 + Math.random() * 30
                        });
                    }
                    board.walls.push(points);
                }
            }

            return board;
        }

        function startProgressionMode() {
            progressionMode = true;
            progressionLevel = 0;
            progressionDifficulty = 1.0;
            progressionScore = 0;

            // Clear existing boards and generate first set
            customBoards = [generateRandomBoard(progressionDifficulty)];
            // Add a couple more boards that can be reached via portals
            customBoards.push(generateRandomBoard(progressionDifficulty + 0.5));
            customBoards.push(generateRandomBoard(progressionDifficulty + 1.0));

            // Update board selector UI
            updateBoardSelectorUI();

            // Start on first board
            switchBoard(0);
            currentLevel = 5; // Use custom level logic
            startGame();

            document.getElementById('level-name-display').textContent = 'Progression - Level 1';
        }

        function advanceProgressionLevel() {
            progressionLevel++;
            progressionDifficulty += 0.3;

            // Generate new boards for next level
            customBoards = [generateRandomBoard(progressionDifficulty)];
            customBoards.push(generateRandomBoard(progressionDifficulty + 0.5));
            customBoards.push(generateRandomBoard(progressionDifficulty + 1.0));

            updateBoardSelectorUI();
            switchBoard(0);

            document.getElementById('level-name-display').textContent = `Progression - Level ${progressionLevel + 1}`;
        }

        function updateBoardSelectorUI() {
            const selector = document.getElementById('board-selector');
            // Remove existing board buttons (except add button)
            const existingBtns = selector.querySelectorAll('.board-btn[data-board]');
            existingBtns.forEach(btn => btn.remove());

            // Add new buttons
            const addBtn = document.getElementById('add-board-btn');
            customBoards.forEach((board, idx) => {
                const btn = document.createElement('button');
                btn.className = 'board-btn' + (idx === currentBoard ? ' active' : '');
                btn.dataset.board = idx;
                btn.textContent = board.name;
                btn.addEventListener('click', () => switchBoard(idx));
                selector.insertBefore(btn, addBtn);
            });
        }

        // Board switching function
        function switchBoard(boardIndex) {
            if (boardIndex < 0 || boardIndex >= customBoards.length) return;
            currentBoard = boardIndex;
            // Update shorthand references
            customBumpers = customBoards[currentBoard].bumpers;
            customFlippers = customBoards[currentBoard].flippers;
            customRamps = customBoards[currentBoard].portals;
            customWalls = customBoards[currentBoard].walls;
            // Update UI
            document.querySelectorAll('.board-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.board) === currentBoard);
            });
            // Rebuild level to show current board
            if (currentLevel === 5) rebuildCustomLevel();
        }

        function addNewBoard() {
            const newIndex = customBoards.length;
            customBoards.push({
                name: `Upper ${newIndex}`,
                bumpers: [],
                flippers: [],
                portals: [],
                walls: []
            });
            // Add button to UI
            const btn = document.createElement('button');
            btn.className = 'board-btn';
            btn.dataset.board = newIndex;
            btn.textContent = `Upper ${newIndex}`;
            btn.addEventListener('click', () => switchBoard(newIndex));
            const addBtn = document.getElementById('add-board-btn');
            addBtn.parentNode.insertBefore(btn, addBtn);
            switchBoard(newIndex);
        }

        // Upper level / portal state
        let isInUpperLevel = false;
        let upperLevelTimer = 0;
        const UPPER_LEVEL_DURATION = 5000; // 5 seconds in upper level

        let currentLevel = 0;
        let gameState = {
            score: 0, highScore: parseInt(localStorage.getItem('pinballHighScore')) || 0,
            ballsRemaining: CONFIG.totalBalls, isPlaying: false, ballInPlay: false, ballLaunched: false
        };

        const engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
        const world = engine.world;
        const canvas = document.getElementById('game-canvas');
        canvas.width = CONFIG.width;
        canvas.height = CONFIG.height;
        const ctx = canvas.getContext('2d');

        const CATEGORY = { WALL: 0x0001, BALL: 0x0002, FLIPPER: 0x0004, BUMPER: 0x0008, SENSOR: 0x0020 };

        let ball = null, leftFlipper = null, rightFlipper = null;
        let bumpers = [], obstacles = [], particles = [];
        let plunger = { power: 0, charging: false };
        const keys = { left: false, right: false };

        // Create smooth curved wall using connected segments
        function createCurvedWall(points, thickness, options) {
            const bodies = [];
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i], p2 = points[i + 1];
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);
                bodies.push(Bodies.rectangle((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, len + thickness, thickness, { ...options, angle }));
                if (i > 0) bodies.push(Bodies.circle(p1.x, p1.y, thickness / 2, options));
            }
            return bodies;
        }

        function createLevel() {
            const level = LEVELS[currentLevel];
            const W = CONFIG.width, H = CONFIG.height;
            const wallOpts = {
                isStatic: true, restitution: 0.3, friction: 0.0,
                render: { fillStyle: level.theme.wall },
                collisionFilter: { category: CATEGORY.WALL }
            };
            const walls = [];

            // Left wall - smooth curve from top to flipper area
            const leftCurve = [
                { x: 25, y: 25 }, { x: 22, y: 80 }, { x: 20, y: 150 },
                { x: 20, y: 300 }, { x: 20, y: 420 },
                { x: 28, y: 500 }, { x: 50, y: 560 }
            ];
            walls.push(...createCurvedWall(leftCurve, 18, wallOpts));

            // Right wall - starts below the flat top section
            const rightCurve = [
                { x: W - 50, y: 100 },
                { x: W - 50, y: 200 }, { x: W - 50, y: 350 },
                { x: W - 42, y: 480 }, { x: W - 30, y: 560 }
            ];
            walls.push(...createCurvedWall(rightCurve, 18, wallOpts));

            // Top wall - flat across the entire top, curves down to plunger lane
            const topCurve = [
                { x: 25, y: 25 }, { x: 100, y: 15 }, { x: 200, y: 12 },
                { x: 300, y: 15 }, { x: W - 50, y: 25 },    // Flat across top
                { x: W - 20, y: 45 }, { x: W - 8, y: 70 }   // Curve down to plunger lane
            ];
            walls.push(...createCurvedWall(topCurve, 16, wallOpts));

            // Plunger lane - right edge wall (full height from y=60 to bottom)
            walls.push(Bodies.rectangle(W - 8, H / 2 + 50, 10, H - 80, wallOpts));

            // Plunger lane - left edge wall (from y=500 to bottom to contain ball)
            walls.push(Bodies.rectangle(W - 42, H - 100, 8, 200, wallOpts));

            // Plunger lane - bottom wall to hold ball until launch
            walls.push(Bodies.rectangle(W - 25, H - 10, 40, 10, wallOpts));


            // Bottom left guide to flipper
            const leftGuide = [{ x: 50, y: 560 }, { x: 70, y: 595 }, { x: 85, y: 625 }];
            walls.push(...createCurvedWall(leftGuide, 12, wallOpts));

            // Bottom right guide to flipper
            const rightGuide = [{ x: W - 70, y: 560 }, { x: W - 90, y: 595 }, { x: W - 105, y: 625 }];
            walls.push(...createCurvedWall(rightGuide, 12, wallOpts));

            // Level-specific elements
            if (currentLevel === 0) {
                // Classic - standard bumper triangle
                createBumper(120, 180, 24);
                createBumper(200, 130, 28);
                createBumper(280, 180, 24);
                createBumper(160, 300, 22);
                createBumper(240, 300, 22);
                // Slingshots
                walls.push(Bodies.polygon(75, H - 180, 3, 30, { ...wallOpts, angle: Math.PI, restitution: 1.3, label: 'slingshot', render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.polygon(W - 95, H - 180, 3, 30, { ...wallOpts, angle: Math.PI, restitution: 1.3, label: 'slingshot', render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 1) {
                // Vortex - spiral pattern
                const cx = 170, cy = 280;
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
                    const r = 50 + i * 18;
                    createBumper(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 18 + (i % 2) * 6);
                }
                walls.push(Bodies.rectangle(170, 280, 70, 10, { ...wallOpts, restitution: 0.8, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 2) {
                // Diamond pattern
                createBumper(180, 120, 24);
                createBumper(100, 200, 20);
                createBumper(260, 200, 20);
                createBumper(180, 280, 24);
                createBumper(100, 360, 20);
                createBumper(260, 360, 20);
                createBumper(180, 440, 24);
                // Angled deflectors
                walls.push(Bodies.rectangle(140, 200, 40, 8, { ...wallOpts, angle: 0.5, render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.rectangle(220, 200, 40, 8, { ...wallOpts, angle: -0.5, render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.rectangle(140, 360, 40, 8, { ...wallOpts, angle: -0.5, render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.rectangle(220, 360, 40, 8, { ...wallOpts, angle: 0.5, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 3) {
                // Castle towers
                createBumper(90, 160, 28);
                createBumper(180, 120, 32);
                createBumper(270, 160, 28);
                createBumper(135, 300, 24);
                createBumper(225, 300, 24);
                createBumper(180, 420, 26);
                // Ramparts
                for (let i = 0; i < 3; i++) {
                    walls.push(Bodies.rectangle(70 + i * 40, 230, 25, 10, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                    walls.push(Bodies.rectangle(210 + i * 40, 230, 25, 10, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                }
                walls.push(Bodies.rectangle(180, 200, 12, 45, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 4) {
                // Wave
                createBumper(90, 180, 22);
                createBumper(270, 220, 22);
                createBumper(130, 340, 24);
                createBumper(230, 400, 24);
                createBumper(170, 480, 20);
                // Wave rails
                const w1 = [{ x: 70, y: 270 }, { x: 110, y: 250 }, { x: 150, y: 270 }, { x: 190, y: 250 }, { x: 230, y: 270 }];
                walls.push(...createCurvedWall(w1, 8, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                const w2 = [{ x: 140, y: 430 }, { x: 180, y: 410 }, { x: 220, y: 430 }, { x: 260, y: 410 }, { x: 300, y: 430 }];
                walls.push(...createCurvedWall(w2, 8, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 5) {
                // Custom level - load saved bumpers, flippers, ramps and walls
                customBumpers.forEach(b => createBumper(b.x, b.y, b.radius));
                customWalls.forEach(wallPoints => {
                    if (wallPoints.length >= 2) {
                        walls.push(...createCurvedWall(wallPoints, 10, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                    }
                });
                // Create custom flippers
                customFlipperBodies = [];
                customFlippers.forEach(f => {
                    const flipperBody = createCustomFlipper(f.x, f.y, f.side);
                    customFlipperBodies.push(flipperBody);
                });
                // Create ramps (portals to upper level)
                customRamps.forEach(r => {
                    const ramp = Bodies.circle(r.x, r.y, 18, {
                        isStatic: true, isSensor: true, label: 'ramp',
                        render: { fillStyle: '#fbbf24' },
                        collisionFilter: { category: CATEGORY.BUMPER }
                    });
                    Composite.add(world, ramp);
                });
            }

            Composite.add(world, walls);
        }

        function createCustomFlipper(x, y, side) {
            const isLeft = side === 'left';
            const level = LEVELS[currentLevel];
            const pivotX = isLeft ? x - 20 : x + 20;

            const flipper = Bodies.rectangle(x, y, 50, 10, {
                label: `custom-flipper-${side}`, density: 0.03, friction: 0.9, restitution: 0.1,
                chamfer: { radius: 5 },
                collisionFilter: { category: CATEGORY.FLIPPER },
                render: { fillStyle: level.theme.accent }
            });

            const pivot = Bodies.circle(pivotX, y, 4, { isStatic: true, render: { fillStyle: level.theme.accent } });
            const constraint = Constraint.create({
                bodyA: flipper, pointA: { x: isLeft ? -20 : 20, y: 0 },
                bodyB: pivot, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0
            });

            Composite.add(world, [flipper, pivot, constraint]);
            // Use same rest angles as main flippers
            const restAngle = isLeft ? CONFIG.flipper.restAngle : -CONFIG.flipper.restAngle;
            Body.setAngle(flipper, restAngle);
            return { flipper, pivot, constraint, side };
        }

        // Editor functions
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CONFIG.width / rect.width;
            const scaleY = CONFIG.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function findBumperAt(x, y) {
            for (let i = customBumpers.length - 1; i >= 0; i--) {
                const b = customBumpers[i];
                const dist = Math.sqrt((b.x - x) ** 2 + (b.y - y) ** 2);
                if (dist < b.radius + 10) return i;
            }
            return -1;
        }

        function findFlipperAt(x, y) {
            for (let i = customFlippers.length - 1; i >= 0; i--) {
                const f = customFlippers[i];
                const dist = Math.sqrt((f.x - x) ** 2 + (f.y - y) ** 2);
                if (dist < 35) return i;
            }
            return -1;
        }

        function findRampAt(x, y) {
            for (let i = customRamps.length - 1; i >= 0; i--) {
                const r = customRamps[i];
                const dist = Math.sqrt((r.x - x) ** 2 + (r.y - y) ** 2);
                if (dist < 25) return i;
            }
            return -1;
        }

        function addCustomBumper(x, y) {
            // Don't place in plunger lane or too close to edges
            if (x > CONFIG.width - 60 || x < 40 || y < 50 || y > CONFIG.height - 100) return;
            customBumpers.push({ x, y, radius: 22 + Math.random() * 8 });
            rebuildCustomLevel();
        }

        function addCustomFlipper(x, y) {
            if (x > CONFIG.width - 60 || x < 40 || y < 80 || y > CONFIG.height - 80) return;
            // Determine side based on x position
            const side = x < CONFIG.width / 2 ? 'left' : 'right';
            customFlippers.push({ x, y, side });
            rebuildCustomLevel();
        }

        function addCustomRamp(x, y) {
            if (x > CONFIG.width - 60 || x < 40 || y < 80 || y > CONFIG.height - 150) return;
            customRamps.push({ x, y });
            rebuildCustomLevel();
        }

        function rebuildCustomLevel() {
            if (currentLevel !== 5) return;
            Composite.clear(world, false);
            bumpers = [];
            customFlipperBodies = [];
            createLevel();
            leftFlipper = createFlipper('left');
            rightFlipper = createFlipper('right');
            createDrainSensor();
            if (editorMode === 'play') createBall();
        }

        function startEditorDrawing(x, y) {
            if (editorMode !== 'wall') return;
            isDrawing = true;
            currentDrawing = [{ x, y }];
        }

        function continueEditorDrawing(x, y) {
            if (!isDrawing || editorMode !== 'wall') return;
            const last = currentDrawing[currentDrawing.length - 1];
            const dist = Math.sqrt((last.x - x) ** 2 + (last.y - y) ** 2);
            if (dist > 15) { // Min distance between points
                currentDrawing.push({ x, y });
            }
        }

        function finishEditorDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentDrawing.length >= 2) {
                customWalls.push([...currentDrawing]);
                rebuildCustomLevel();
            }
            currentDrawing = [];
        }

        function clearCustomLevel() {
            // Clear only current board
            customBoards[currentBoard].bumpers = [];
            customBoards[currentBoard].flippers = [];
            customBoards[currentBoard].portals = [];
            customBoards[currentBoard].walls = [];
            // Update shorthand references
            customBumpers = customBoards[currentBoard].bumpers;
            customFlippers = customBoards[currentBoard].flippers;
            customRamps = customBoards[currentBoard].portals;
            customWalls = customBoards[currentBoard].walls;
            rebuildCustomLevel();
        }

        function setEditorMode(mode) {
            editorMode = mode;
            document.getElementById('bumper-mode-btn').classList.toggle('active', mode === 'bumper');
            document.getElementById('flipper-mode-btn').classList.toggle('active', mode === 'flipper');
            document.getElementById('portal-mode-btn').classList.toggle('active', mode === 'portal');
            document.getElementById('wall-mode-btn').classList.toggle('active', mode === 'wall');
            document.getElementById('play-test-btn').classList.toggle('active', mode === 'play');

            if (mode === 'play') {
                gameState.isPlaying = true;
                gameState.ballsRemaining = CONFIG.totalBalls;
                gameState.score = 0;
                isInUpperLevel = false;
                activeBoardInPlay = 0; // Start on main board
                updateScoreDisplay();
                updateBallsDisplay();
                // Load main board for play
                switchBoard(0);
                createBall();
                document.getElementById('editor-instructions').style.display = 'none';
                document.getElementById('board-selector').style.display = 'none';
            } else {
                gameState.isPlaying = false;
                if (ball) { Composite.remove(world, ball); ball = null; }
                document.getElementById('editor-instructions').style.display = 'block';
                document.getElementById('board-selector').style.display = 'flex';
                document.getElementById('level-name-display').textContent = 'Custom Editor - ' + customBoards[currentBoard].name;
                const instructions = {
                    'bumper': 'Tap to place bumpers | Drag to move',
                    'flipper': 'Tap to place flippers | Left/Right auto-detected',
                    'portal': 'Tap to place portals | Warp to next board',
                    'wall': 'Draw walls with your finger'
                };
                document.getElementById('editor-instructions').textContent = instructions[mode] || '';
            }
        }

        function createFlipper(side) {
            const isLeft = side === 'left';
            const x = isLeft ? 150 : CONFIG.width - 150;  // Closer together - ~40px gap (2 ball widths)
            const y = CONFIG.height - 65;
            const pivotX = isLeft ? x - 25 : x + 25;
            const level = LEVELS[currentLevel];

            const flipper = Bodies.rectangle(x, y, 60, 12, {
                label: `flipper-${side}`, density: 0.03, friction: 0.9, restitution: 0.1,
                chamfer: { radius: 6 },
                collisionFilter: { category: CATEGORY.FLIPPER },
                render: { fillStyle: level.theme.accent }
            });

            const pivot = Bodies.circle(pivotX, y, 5, { isStatic: true, render: { fillStyle: level.theme.accent } });
            const constraint = Constraint.create({
                bodyA: flipper, pointA: { x: isLeft ? -25 : 25, y: 0 },
                bodyB: pivot, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0
            });

            Composite.add(world, [flipper, pivot, constraint]);
            Body.setAngle(flipper, isLeft ? CONFIG.flipper.restAngle : -CONFIG.flipper.restAngle);
            return { flipper, pivot, constraint };
        }

        function createBumper(x, y, radius) {
            const level = LEVELS[currentLevel];
            const bumper = Bodies.circle(x, y, radius, {
                isStatic: true, label: 'bumper', restitution: 1.5,
                render: { fillStyle: level.theme.bumper },
                collisionFilter: { category: CATEGORY.BUMPER },
                plugin: { score: 100, isFlashing: false }
            });
            Composite.add(world, bumper);
            bumpers.push(bumper);
        }

        function createDrainSensor() {
            Composite.add(world, Bodies.rectangle(CONFIG.width / 2, CONFIG.height + 30, CONFIG.width, 60, {
                isStatic: true, isSensor: true, label: 'drain',
                render: { fillStyle: 'transparent' },
                collisionFilter: { category: CATEGORY.SENSOR }
            }));
        }

        function createBall() {
            if (ball) Composite.remove(world, ball);
            ball = Bodies.circle(CONFIG.width - 25, CONFIG.height - 50, CONFIG.ball.radius, {
                label: 'ball', restitution: CONFIG.ball.restitution,
                friction: CONFIG.ball.friction, frictionAir: CONFIG.ball.frictionAir,
                density: CONFIG.ball.density, render: { fillStyle: '#ddd' },
                collisionFilter: { category: CATEGORY.BALL, mask: CATEGORY.WALL | CATEGORY.FLIPPER | CATEGORY.BUMPER | CATEGORY.SENSOR }
            });
            Composite.add(world, ball);
            gameState.ballLaunched = false;
            gameState.ballInPlay = true;
            document.getElementById('launch-indicator').style.display = 'block';
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { keys.left = true; e.preventDefault(); }
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { keys.right = true; e.preventDefault(); }
            if (e.key === ' ') { if (!gameState.ballLaunched && gameState.ballInPlay) plunger.charging = true; e.preventDefault(); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
            if (e.key === ' ') { if (plunger.charging && !gameState.ballLaunched) launchBall(); plunger.charging = false; }
        });

        const activeTouches = new Map();
        const gameContainer = document.getElementById('game-container');
        let launchTouchId = null, touchStartY = 0;

        function updateFlipperStates() {
            let l = false, r = false;
            activeTouches.forEach(s => { if (s === 'left') l = true; if (s === 'right') r = true; });
            keys.left = l; keys.right = r;
            document.getElementById('touch-left').classList.toggle('touch-active', l);
            document.getElementById('touch-right').classList.toggle('touch-active', r);
        }

        document.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'BUTTON') return;

            // Editor mode touch handling
            if (isEditing && editorMode !== 'play') {
                const t = e.changedTouches[0];
                const coords = getCanvasCoords(t.clientX, t.clientY);
                const rect = canvas.getBoundingClientRect();
                if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                    if (editorMode === 'bumper') {
                        const idx = findBumperAt(coords.x, coords.y);
                        if (idx >= 0) {
                            draggedBumper = idx;
                        } else {
                            addCustomBumper(coords.x, coords.y);
                        }
                    } else if (editorMode === 'flipper') {
                        const idx = findFlipperAt(coords.x, coords.y);
                        if (idx >= 0) {
                            draggedFlipper = idx;
                        } else {
                            addCustomFlipper(coords.x, coords.y);
                        }
                    } else if (editorMode === 'portal') {
                        const idx = findRampAt(coords.x, coords.y);
                        if (idx >= 0) {
                            draggedPortal = idx;
                        } else {
                            addCustomRamp(coords.x, coords.y);
                        }
                    } else if (editorMode === 'wall') {
                        startEditorDrawing(coords.x, coords.y);
                    }
                    e.preventDefault();
                    return;
                }
            }

            for (const t of e.changedTouches) {
                activeTouches.set(t.identifier, t.clientX < window.innerWidth / 2 ? 'left' : 'right');
                const rect = gameContainer.getBoundingClientRect();
                if (launchTouchId === null && !gameState.ballLaunched && gameState.ballInPlay &&
                    t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                    launchTouchId = t.identifier; touchStartY = t.clientY; plunger.charging = true;
                }
            }
            updateFlipperStates();
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            // Editor mode touch handling
            if (isEditing && editorMode !== 'play') {
                const t = e.changedTouches[0];
                const coords = getCanvasCoords(t.clientX, t.clientY);
                if (editorMode === 'bumper' && draggedBumper !== null) {
                    customBumpers[draggedBumper].x = coords.x;
                    customBumpers[draggedBumper].y = coords.y;
                    rebuildCustomLevel();
                } else if (editorMode === 'flipper' && draggedFlipper !== null) {
                    customFlippers[draggedFlipper].x = coords.x;
                    customFlippers[draggedFlipper].y = coords.y;
                    customFlippers[draggedFlipper].side = coords.x < CONFIG.width / 2 ? 'left' : 'right';
                    rebuildCustomLevel();
                } else if (editorMode === 'portal' && draggedPortal !== null) {
                    customRamps[draggedPortal].x = coords.x;
                    customRamps[draggedPortal].y = coords.y;
                    rebuildCustomLevel();
                } else if (editorMode === 'wall') {
                    continueEditorDrawing(coords.x, coords.y);
                }
                e.preventDefault();
                return;
            }

            for (const t of e.changedTouches) if (activeTouches.has(t.identifier)) activeTouches.set(t.identifier, t.clientX < window.innerWidth / 2 ? 'left' : 'right');
            updateFlipperStates();
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            // Editor mode touch handling
            if (isEditing && editorMode !== 'play') {
                draggedBumper = null;
                draggedFlipper = null;
                draggedPortal = null;
                if (editorMode === 'wall') {
                    finishEditorDrawing();
                }
            }

            for (const t of e.changedTouches) {
                if (t.identifier === launchTouchId && plunger.charging) {
                    plunger.power = Math.max(0.6, Math.min((touchStartY - t.clientY) / 80, 1));
                    launchBall(); plunger.charging = false; launchTouchId = null;
                }
                activeTouches.delete(t.identifier);
            }
            updateFlipperStates();
        }, { passive: false });

        document.addEventListener('touchcancel', (e) => {
            draggedBumper = null;
            draggedFlipper = null;
            draggedPortal = null;
            finishEditorDrawing();
            for (const t of e.changedTouches) { activeTouches.delete(t.identifier); if (t.identifier === launchTouchId) { plunger.charging = false; launchTouchId = null; } }
            updateFlipperStates();
        }, { passive: false });

        function launchBall() {
            if (!ball || gameState.ballLaunched) return;
            const power = Math.max(plunger.power, 0.7);
            Body.applyForce(ball, ball.position, { x: 0, y: -0.055 * power });
            gameState.ballLaunched = true; plunger.power = 0;
            document.getElementById('launch-indicator').style.display = 'none';
        }

        function updateFlippers() {
            if (!leftFlipper || !rightFlipper) return;
            const lTarget = keys.left ? CONFIG.flipper.activeAngle : CONFIG.flipper.restAngle;
            const rTarget = keys.right ? -CONFIG.flipper.activeAngle : -CONFIG.flipper.restAngle;
            Body.setAngularVelocity(leftFlipper.flipper, (lTarget - leftFlipper.flipper.angle) * 0.35);
            Body.setAngularVelocity(rightFlipper.flipper, (rTarget - rightFlipper.flipper.angle) * 0.35);

            // Update custom flippers - exact same calculation as main flippers
            customFlipperBodies.forEach(cf => {
                if (!cf || !cf.flipper) return;
                // Use exact same target calculation as main flippers (lTarget/rTarget above)
                const target = cf.side === 'left' ? lTarget : rTarget;
                Body.setAngularVelocity(cf.flipper, (target - cf.flipper.angle) * 0.4);
            });
        }

        // Collisions
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(({ bodyA, bodyB }) => {
                const bumper = bodyA.label === 'bumper' ? bodyA : bodyB.label === 'bumper' ? bodyB : null;
                if (bumper && bumper.plugin) {
                    gameState.score += bumper.plugin.score;
                    updateScoreDisplay();
                    createScorePopup(bumper.position.x, bumper.position.y, bumper.plugin.score);
                    bumper.plugin.isFlashing = true;
                    setTimeout(() => bumper.plugin.isFlashing = false, 80);
                    createParticles(bumper.position.x, bumper.position.y, LEVELS[currentLevel].theme.bumper);
                }
                if (bodyA.label === 'slingshot' || bodyB.label === 'slingshot') {
                    gameState.score += 50; updateScoreDisplay();
                }
                // Ramp collision - send ball to upper level
                const ramp = bodyA.label === 'ramp' ? bodyA : bodyB.label === 'ramp' ? bodyB : null;
                const ballBody = bodyA.label === 'ball' ? bodyA : bodyB.label === 'ball' ? bodyB : null;
                if (ramp && ballBody && !isInUpperLevel) {
                    enterUpperLevel(ramp.position.x);
                }
                if ((bodyA.label === 'drain' || bodyB.label === 'drain') && (bodyA.label === 'ball' || bodyB.label === 'ball')) {
                    gameState.ballInPlay = false; gameState.ballsRemaining--;
                    updateBallsDisplay();
                    if (gameState.ballsRemaining <= 0) endGame(); else setTimeout(createBall, 800);
                }
            });
        });

        // Multi-board portal functions
        function enterUpperLevel(rampX) {
            if (!ball || isInUpperLevel) return;

            // Check if there's a next board to go to
            const nextBoard = activeBoardInPlay + 1;
            if (nextBoard >= customBoards.length) {
                // No more boards - give bonus and return
                gameState.score += 1000;
                updateScoreDisplay();
                createScorePopup(rampX, 100, 1000);
                // Bounce ball back
                Body.setVelocity(ball, { x: (Math.random() - 0.5) * 8, y: 5 });
                return;
            }

            isInUpperLevel = true;
            upperLevelTimer = Date.now();
            gameState.score += 500;
            updateScoreDisplay();
            createScorePopup(rampX, 100, 500);

            // Transition to next board
            activeBoardInPlay = nextBoard;
            loadBoardForPlay(nextBoard);

            // Drop ball from top of new board
            const dropX = 100 + Math.random() * (CONFIG.width - 200);
            Body.setPosition(ball, { x: dropX, y: 50 });
            Body.setVelocity(ball, { x: (Math.random() - 0.5) * 3, y: 3 });
        }

        function updateUpperLevel() {
            if (!isInUpperLevel || !ball) return;
            const elapsed = Date.now() - upperLevelTimer;

            // After duration on upper board, return to main
            if (elapsed > UPPER_LEVEL_DURATION) {
                exitUpperLevel();
            }
        }

        function exitUpperLevel() {
            if (!ball) return;
            isInUpperLevel = false;

            // Bonus for completing upper level
            const levelBonus = 250 * activeBoardInPlay;
            gameState.score += levelBonus;

            // In progression mode, check if we should advance to next level
            if (progressionMode && activeBoardInPlay >= customBoards.length - 1) {
                // Completed all boards! Advance to next progression level
                advanceProgressionLevel();
                gameState.score += 1000; // Level completion bonus
                updateScoreDisplay();
                createScorePopup(CONFIG.width / 2, 150, 1000);
            }

            // Return to main board (board 0)
            activeBoardInPlay = 0;
            loadBoardForPlay(0);

            // Drop ball from top
            const dropX = 100 + Math.random() * (CONFIG.width - 200);
            Body.setPosition(ball, { x: dropX, y: 50 });
            Body.setVelocity(ball, { x: (Math.random() - 0.5) * 3, y: 3 });

            updateScoreDisplay();
            if (levelBonus > 0) createScorePopup(dropX, 80, levelBonus);
        }

        // Load a specific board for play (preserves ball)
        function loadBoardForPlay(boardIndex) {
            const savedBall = ball;
            const savedVel = ball ? { x: ball.velocity.x, y: ball.velocity.y } : { x: 0, y: 0 };
            const savedPos = ball ? { x: ball.position.x, y: ball.position.y } : { x: 200, y: 50 };

            // Remove ball temporarily
            if (ball) Composite.remove(world, ball);
            ball = null;

            // Switch board data
            currentBoard = boardIndex;
            customBumpers = customBoards[currentBoard].bumpers;
            customFlippers = customBoards[currentBoard].flippers;
            customRamps = customBoards[currentBoard].portals;
            customWalls = customBoards[currentBoard].walls;

            // Rebuild level
            Composite.clear(world, false);
            bumpers = [];
            customFlipperBodies = [];
            createLevel();
            leftFlipper = createFlipper('left');
            rightFlipper = createFlipper('right');
            createDrainSensor();

            // Restore ball
            ball = Bodies.circle(savedPos.x, savedPos.y, CONFIG.ball.radius, {
                label: 'ball', restitution: CONFIG.ball.restitution,
                friction: CONFIG.ball.friction, frictionAir: CONFIG.ball.frictionAir,
                density: CONFIG.ball.density, render: { fillStyle: '#ddd' },
                collisionFilter: { category: CATEGORY.BALL, mask: CATEGORY.WALL | CATEGORY.FLIPPER | CATEGORY.BUMPER | CATEGORY.SENSOR }
            });
            Body.setVelocity(ball, savedVel);
            Composite.add(world, ball);

            // Update display
            document.getElementById('level-name-display').textContent =
                customBoards[boardIndex].name + (boardIndex > 0 ? ' - UPPER LEVEL!' : '');
        }

        function updateScoreDisplay() { document.querySelector('#current-score .score-value').textContent = gameState.score.toLocaleString(); }
        function updateBallsDisplay() { document.querySelector('#balls-left .score-value').textContent = gameState.ballsRemaining; }
        function updateHighScore() {
            if (gameState.score > gameState.highScore) { gameState.highScore = gameState.score; localStorage.setItem('pinballHighScore', gameState.highScore); }
            document.querySelector('#high-score .score-value').textContent = gameState.highScore.toLocaleString();
        }

        function createScorePopup(x, y, pts) {
            const p = document.createElement('div'); p.className = 'score-popup'; p.textContent = '+' + pts;
            const r = canvas.getBoundingClientRect();
            p.style.left = (r.left + x) + 'px'; p.style.top = (r.top + y) + 'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1, color, size: Math.random() * 4 + 2 });
        }

        function updateParticles() {
            particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.025; return p.life > 0; });
        }

        // Render
        function render() {
            const level = LEVELS[currentLevel];
            ctx.fillStyle = level.theme.bg;
            ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

            Composite.allBodies(world).forEach(body => {
                if (body.render.fillStyle === 'transparent') return;
                ctx.beginPath();
                let fill = body.render.fillStyle;
                if (body.plugin?.isFlashing) fill = '#fff';
                ctx.fillStyle = fill;

                if (body.circleRadius) {
                    ctx.arc(body.position.x, body.position.y, body.circleRadius, 0, Math.PI * 2);
                } else {
                    const v = body.vertices;
                    ctx.moveTo(v[0].x, v[0].y);
                    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
                    ctx.closePath();
                }
                ctx.fill();

                if (body.label === 'bumper') {
                    ctx.shadowColor = level.theme.bumper; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, body.circleRadius * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = body.plugin?.isFlashing ? '#fff' : level.theme.bg; ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('100', body.position.x, body.position.y);
                }

                if (body.label === 'ball') {
                    const g = ctx.createRadialGradient(body.position.x - 3, body.position.y - 3, 0, body.position.x, body.position.y, body.circleRadius);
                    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ccc'); g.addColorStop(1, '#666');
                    ctx.fillStyle = g; ctx.fill();
                    ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.stroke();
                }
            });

            if (leftFlipper && rightFlipper) {
                [leftFlipper.pivot, rightFlipper.pivot].forEach(p => {
                    ctx.beginPath(); ctx.arc(p.position.x, p.position.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = level.theme.accent; ctx.shadowColor = level.theme.accent; ctx.shadowBlur = 10;
                    ctx.fill(); ctx.shadowBlur = 0;
                });
            }

            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill(); ctx.globalAlpha = 1;
            });

            // Plunger lane visual
            ctx.fillStyle = level.theme.wall + '80';
            ctx.fillRect(CONFIG.width - 38, CONFIG.height - 110, 26, 100);

            const offset = plunger.charging ? plunger.power * 20 : 0;
            ctx.fillStyle = level.theme.accent;
            ctx.beginPath(); ctx.arc(CONFIG.width - 25, CONFIG.height - 20 + offset, 10, 0, Math.PI * 2); ctx.fill();

            if (plunger.charging) {
                plunger.power = Math.min(plunger.power + 0.03, 1);
                ctx.fillStyle = `rgba(0,255,136,${plunger.power})`;
                ctx.fillRect(CONFIG.width - 36, CONFIG.height - 105, 22 * plunger.power, 5);
            }

            if (!gameState.ballLaunched && gameState.ballInPlay) {
                ctx.fillStyle = 'rgba(0,255,136,0.15)';
                ctx.fillRect(CONFIG.width - 38, CONFIG.height - 110, 26, 90);
            }

            // Draw current wall being created
            if (isEditing && isDrawing && currentDrawing.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = level.theme.accent;
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.moveTo(currentDrawing[0].x, currentDrawing[0].y);
                for (let i = 1; i < currentDrawing.length; i++) {
                    ctx.lineTo(currentDrawing[i].x, currentDrawing[i].y);
                }
                ctx.stroke();
            }

            // Draw editor hint area
            if (isEditing && !gameState.isPlaying) {
                ctx.fillStyle = 'rgba(244, 114, 182, 0.2)';
                ctx.strokeStyle = 'rgba(244, 114, 182, 0.5)';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.rect(40, 50, CONFIG.width - 100, CONFIG.height - 150);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw ramps with special glow effect
            customRamps.forEach(r => {
                ctx.beginPath();
                ctx.arc(r.x, r.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
                // Draw arrow indicating "up"
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.moveTo(r.x, r.y - 8);
                ctx.lineTo(r.x - 6, r.y + 4);
                ctx.lineTo(r.x + 6, r.y + 4);
                ctx.closePath();
                ctx.fill();
            });

            // Upper level indicator - show when on any board other than main
            if (activeBoardInPlay > 0 && gameState.isPlaying) {
                const elapsed = Date.now() - upperLevelTimer;
                const remaining = Math.max(0, UPPER_LEVEL_DURATION - elapsed);
                const progress = remaining / UPPER_LEVEL_DURATION;

                // Draw upper level banner
                ctx.fillStyle = 'rgba(251, 191, 36, 0.9)';
                ctx.fillRect(0, 0, CONFIG.width, 40);
                ctx.fillStyle = '#1a1a2e';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(customBoards[activeBoardInPlay].name.toUpperCase() + '!', CONFIG.width / 2, 18);

                // Progress bar showing time remaining
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(20, 28, CONFIG.width - 40, 8);
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(20, 28, (CONFIG.width - 40) * progress, 8);

                // Board indicator
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = '#1a1a2e';
                ctx.fillText(`Board ${activeBoardInPlay + 1} of ${customBoards.length}`, CONFIG.width / 2, 38);
            }
        }

        function gameLoop() {
            if (gameState.isPlaying) {
                updateFlippers();
                updateUpperLevel();
                Engine.update(engine, 1000 / 60);
                updateParticles();
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState.score = 0; gameState.ballsRemaining = CONFIG.totalBalls;
            gameState.isPlaying = true; gameState.ballInPlay = false;
            Composite.clear(world, false); bumpers = []; obstacles = []; particles = [];
            createLevel();
            leftFlipper = createFlipper('left'); rightFlipper = createFlipper('right');
            createDrainSensor(); createBall();
            updateScoreDisplay(); updateBallsDisplay(); updateHighScore();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('menu-btn').style.display = 'block';
            document.getElementById('level-name-display').textContent = LEVELS[currentLevel].name;
        }

        function endGame() {
            gameState.isPlaying = false; updateHighScore();
            let finalText = gameState.score.toLocaleString();
            if (progressionMode) {
                finalText += `\nLevel ${progressionLevel + 1} reached!`;
            }
            document.getElementById('final-score').textContent = finalText;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('menu-btn').style.display = 'none';
            document.getElementById('board-selector').style.display = 'none';
        }

        function showLevelSelect() {
            gameState.isPlaying = false;
            progressionMode = false;
            isInUpperLevel = false;
            activeBoardInPlay = 0;
            Composite.clear(world, false);
            document.getElementById('level-select').style.display = 'block';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu-btn').style.display = 'none';
            document.getElementById('board-selector').style.display = 'none';
        }

        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected'); currentLevel = parseInt(btn.dataset.level);
            });
        });
        document.getElementById('play-btn').addEventListener('click', () => {
            if (currentLevel === 5) {
                startCustomEditor();
            } else if (currentLevel === 6) {
                startProgressionMode();
            } else {
                startGame();
            }
        });
        document.getElementById('restart-btn').addEventListener('click', showLevelSelect);
        document.getElementById('menu-btn').addEventListener('click', () => {
            isEditing = false;
            document.getElementById('editor-controls').style.display = 'none';
            document.getElementById('editor-instructions').style.display = 'none';
            document.getElementById('board-selector').style.display = 'none';
            showLevelSelect();
        });

        // Editor button listeners
        document.getElementById('bumper-mode-btn').addEventListener('click', () => setEditorMode('bumper'));
        document.getElementById('flipper-mode-btn').addEventListener('click', () => setEditorMode('flipper'));
        document.getElementById('portal-mode-btn').addEventListener('click', () => setEditorMode('portal'));
        document.getElementById('wall-mode-btn').addEventListener('click', () => setEditorMode('wall'));
        document.getElementById('play-test-btn').addEventListener('click', () => setEditorMode('play'));
        document.getElementById('clear-btn').addEventListener('click', clearCustomLevel);

        // Board selector button listeners
        document.querySelectorAll('.board-btn[data-board]').forEach(btn => {
            btn.addEventListener('click', () => switchBoard(parseInt(btn.dataset.board)));
        });
        document.getElementById('add-board-btn').addEventListener('click', addNewBoard);

        function startCustomEditor() {
            isEditing = true;
            editorMode = 'bumper';
            gameState.score = 0;
            gameState.ballsRemaining = CONFIG.totalBalls;
            gameState.isPlaying = false;
            gameState.ballInPlay = false;
            Composite.clear(world, false);
            bumpers = [];
            particles = [];
            // Reset to main board
            switchBoard(0);
            createLevel();
            leftFlipper = createFlipper('left');
            rightFlipper = createFlipper('right');
            createDrainSensor();
            updateScoreDisplay();
            updateBallsDisplay();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('menu-btn').style.display = 'block';
            document.getElementById('editor-controls').style.display = 'flex';
            document.getElementById('board-selector').style.display = 'flex';
            document.getElementById('editor-instructions').style.display = 'block';
            document.getElementById('level-name-display').textContent = 'Custom Editor - ' + customBoards[currentBoard].name;
            setEditorMode('bumper');
        }

        // Mouse support for desktop editing
        canvas.addEventListener('mousedown', (e) => {
            if (!isEditing || editorMode === 'play') return;
            const coords = getCanvasCoords(e.clientX, e.clientY);
            if (editorMode === 'bumper') {
                const idx = findBumperAt(coords.x, coords.y);
                if (idx >= 0) {
                    draggedBumper = idx;
                } else {
                    addCustomBumper(coords.x, coords.y);
                }
            } else if (editorMode === 'flipper') {
                const idx = findFlipperAt(coords.x, coords.y);
                if (idx >= 0) {
                    draggedFlipper = idx;
                } else {
                    addCustomFlipper(coords.x, coords.y);
                }
            } else if (editorMode === 'portal') {
                const idx = findRampAt(coords.x, coords.y);
                if (idx >= 0) {
                    draggedPortal = idx;
                } else {
                    addCustomRamp(coords.x, coords.y);
                }
            } else if (editorMode === 'wall') {
                startEditorDrawing(coords.x, coords.y);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isEditing || editorMode === 'play') return;
            const coords = getCanvasCoords(e.clientX, e.clientY);
            if (editorMode === 'bumper' && draggedBumper !== null) {
                customBumpers[draggedBumper].x = coords.x;
                customBumpers[draggedBumper].y = coords.y;
                rebuildCustomLevel();
            } else if (editorMode === 'flipper' && draggedFlipper !== null) {
                customFlippers[draggedFlipper].x = coords.x;
                customFlippers[draggedFlipper].y = coords.y;
                customFlippers[draggedFlipper].side = coords.x < CONFIG.width / 2 ? 'left' : 'right';
                rebuildCustomLevel();
            } else if (editorMode === 'portal' && draggedPortal !== null) {
                customRamps[draggedPortal].x = coords.x;
                customRamps[draggedPortal].y = coords.y;
                rebuildCustomLevel();
            } else if (editorMode === 'wall') {
                continueEditorDrawing(coords.x, coords.y);
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (!isEditing || editorMode === 'play') return;
            draggedBumper = null;
            draggedFlipper = null;
            draggedPortal = null;
            finishEditorDrawing();
        });

        canvas.addEventListener('mouseleave', () => {
            draggedBumper = null;
            draggedFlipper = null;
            draggedPortal = null;
            finishEditorDrawing();
        });

        function handleResize() {
            const scale = Math.min((window.innerWidth - 20) / CONFIG.width, (window.innerHeight - 120) / CONFIG.height, 1);
            canvas.style.transform = `scale(${scale})`; canvas.style.transformOrigin = 'top center';
        }
        window.addEventListener('resize', handleResize); handleResize();

        window.onload = () => { updateHighScore(); document.getElementById('level-select').style.display = 'block'; gameLoop(); };
    </script>
</body>
</html>
