<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pinball Alley</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        #score-display {
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            border: 3px solid #4a4a6a;
            border-radius: 0;
            padding: 10px 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-item { text-align: center; }
        .score-label { color: #8888aa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .score-value { color: #00ff88; font-size: 24px; font-weight: bold; font-family: 'Courier New', monospace; }
        #high-score .score-value { color: #ffcc00; }
        #balls-left .score-value { color: #ff6688; }
        #game-canvas { border: 3px solid #4a4a6a; border-top: none; border-radius: 0; }

        .score-popup {
            position: absolute; color: #ffcc00; font-size: 20px; font-weight: bold;
            pointer-events: none; animation: scoreFloat 1s ease-out forwards; z-index: 100;
        }
        @keyframes scoreFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        #game-over, #level-select {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95); padding: 25px; border-radius: 20px;
            text-align: center; z-index: 200; border: 3px solid #4a4a6a;
        }
        #game-over { display: none; border-color: #ff6688; }
        #game-over h2 { color: #ff6688; font-size: 32px; margin-bottom: 15px; }
        #final-score { color: #00ff88; font-size: 28px; font-weight: bold; margin: 15px 0; }
        #final-floor { color: #22d3ee; font-size: 18px; margin-bottom: 10px; display: none; }
        #level-select h2 { color: #00ff88; font-size: 24px; margin-bottom: 15px; }

        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .level-btn {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border: 2px solid #4a4a6a; padding: 12px 8px; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; min-width: 130px;
        }
        .level-btn:hover, .level-btn.selected { border-color: #00ff88; transform: scale(1.05); }
        .level-btn .level-name { color: #fff; font-size: 14px; font-weight: bold; display: block; margin-bottom: 3px; }
        .level-btn .level-desc { color: #8888aa; font-size: 10px; }
        .level-btn .level-icon { font-size: 20px; margin-bottom: 3px; }
        .level-btn.climb-btn { border-color: #22d3ee; }
        .level-btn.climb-btn:hover, .level-btn.climb-btn.selected { border-color: #00ff88; }

        #restart-btn, #play-btn, #menu-btn {
            background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%);
            border: none; padding: 12px 35px; font-size: 18px; font-weight: bold;
            color: #1a1a2e; border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        #restart-btn:hover, #play-btn:hover, #menu-btn:hover { transform: scale(1.1); }

        #menu-btn {
            position: absolute; top: 55px; left: 10px; padding: 8px 15px; font-size: 14px;
            background: linear-gradient(180deg, #ff6688 0%, #cc4466 100%); z-index: 100;
            display: none;
        }

        #instructions { color: #8888aa; font-size: 11px; margin-top: 10px; text-align: center; }
        #instructions span { color: #ffcc00; }
        .touch-zone { position: absolute; bottom: 0; width: 50%; height: 100%; z-index: 50; pointer-events: none; }
        #touch-left { left: 0; }
        #touch-right { right: 0; }
        .touch-active { background: radial-gradient(ellipse at bottom, rgba(255, 102, 136, 0.3) 0%, transparent 70%); }
        #launch-indicator {
            position: absolute; bottom: 15px; right: 15px; color: #00ff88;
            font-size: 12px; animation: pulse 1s infinite; display: none;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #level-name-display {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            color: #ffcc00; font-size: 12px; font-weight: bold; opacity: 0.8;
        }
        #climb-hud {
            position: absolute; top: 8px; right: 10px; display: none; z-index: 100;
            text-align: right;
        }
        #climb-hud .floor-display { color: #22d3ee; font-size: 14px; font-weight: bold; }
        #climb-hud .element-display { font-size: 12px; margin-top: 2px; }
        #ball-save-indicator {
            position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%);
            color: #00ff88; font-size: 14px; font-weight: bold; display: none;
            animation: pulse 0.5s infinite; z-index: 100;
        }
        #editor-controls {
            display: none; z-index: 100;
            flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px;
            padding: 6px; background: rgba(26,26,46,0.95);
            border: 2px solid #4a4a6a; border-top: none; width: 100%; max-width: 400px;
        }
        .editor-btn {
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            border: none; padding: 6px 10px; font-size: 11px; font-weight: bold;
            color: #fff; border-radius: 5px; cursor: pointer; white-space: nowrap;
        }
        .editor-btn.active { background: linear-gradient(180deg, #00ff88 0%, #00cc66 100%); color: #1a1a2e; }
        .editor-btn.danger { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); }
        .editor-btn.extend { background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); }
        .editor-btn.extend.active { background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%); color: #1a1a2e; }
        #editor-instructions {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            color: #ffcc00; font-size: 11px; text-align: center; display: none;
            background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">
            <div class="score-item" id="high-score">
                <div class="score-label">High Score</div>
                <div class="score-value">0</div>
            </div>
            <div class="score-item" id="current-score">
                <div class="score-label">Score</div>
                <div class="score-value">0</div>
            </div>
            <div class="score-item" id="balls-left">
                <div class="score-label">Balls</div>
                <div class="score-value">3</div>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <button id="menu-btn">MENU</button>
        <div id="touch-left" class="touch-zone"></div>
        <div id="touch-right" class="touch-zone"></div>
        <div id="launch-indicator">Tap to Launch!</div>
        <div id="level-name-display"></div>
        <div id="climb-hud">
            <div class="floor-display">Floor: <span id="floor-num">1</span> / <span id="floor-total">5</span></div>
            <div class="element-display" id="element-display"></div>
        </div>
        <div id="ball-save-indicator">BALL SAVE!</div>
        <div id="editor-controls">
            <button class="editor-btn active" id="bumper-mode-btn">Bumper</button>
            <button class="editor-btn" id="flipper-mode-btn">Flipper</button>
            <button class="editor-btn" id="ramp-mode-btn">Ramp</button>
            <button class="editor-btn" id="wall-mode-btn">Wall</button>
            <button class="editor-btn extend" id="extend-btn">Extend</button>
            <button class="editor-btn" id="play-test-btn">Test</button>
            <button class="editor-btn danger" id="clear-btn">Clear</button>
        </div>
        <div id="editor-instructions">Tap to place bumpers | Draw to create walls</div>

        <div id="level-select">
            <h2>SELECT LEVEL</h2>
            <div class="level-grid">
                <button class="level-btn selected" data-level="0">
                    <div class="level-icon">🎯</div>
                    <span class="level-name">Classic</span>
                    <span class="level-desc">Traditional layout</span>
                </button>
                <button class="level-btn" data-level="1">
                    <div class="level-icon">🌀</div>
                    <span class="level-name">Vortex</span>
                    <span class="level-desc">Spiral madness</span>
                </button>
                <button class="level-btn" data-level="2">
                    <div class="level-icon">💎</div>
                    <span class="level-name">Diamond</span>
                    <span class="level-desc">Gem patterns</span>
                </button>
                <button class="level-btn" data-level="3">
                    <div class="level-icon">🏰</div>
                    <span class="level-name">Castle</span>
                    <span class="level-desc">Tower defense</span>
                </button>
                <button class="level-btn" data-level="4">
                    <div class="level-icon">🌊</div>
                    <span class="level-name">Wave</span>
                    <span class="level-desc">Curved chaos</span>
                </button>
                <button class="level-btn" data-level="5">
                    <div class="level-icon">🎨</div>
                    <span class="level-name">Custom</span>
                    <span class="level-desc">Build your own!</span>
                </button>
                <button class="level-btn climb-btn" data-level="6" style="grid-column: span 2;">
                    <div class="level-icon">🧗</div>
                    <span class="level-name">Climb Mode</span>
                    <span class="level-desc">Ice Climbers meets Pinball! Scale 20 floors with elemental balls!</span>
                </button>
            </div>
            <button id="play-btn">PLAY</button>
        </div>

        <div id="game-over">
            <h2>GAME OVER</h2>
            <p style="color:#fff">Final Score:</p>
            <div id="final-score">0</div>
            <div id="final-floor">Reached Floor: <span id="final-floor-num">1</span></div>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>
    <div id="instructions">
        <span>Desktop:</span> A/D for flippers | Space to launch |
        <span>Mobile:</span> Tap sides for flippers
    </div>

    <script>
        const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;

        const CONFIG = {
            width: 400, height: 700,
            ball: { radius: 10, restitution: 0.5, friction: 0.001, frictionAir: 0.0005, density: 0.0015 },
            flipper: { restAngle: 0.5, activeAngle: -0.5 },
            totalBalls: 3
        };

        const LEVELS = [
            { name: "Classic", theme: { bg: '#1a1a2e', wall: '#4a5568', bumper: '#00ccff', accent: '#ff6688' } },
            { name: "Vortex", theme: { bg: '#0a0a1a', wall: '#6366f1', bumper: '#a855f7', accent: '#22d3ee' } },
            { name: "Diamond", theme: { bg: '#1a2e2a', wall: '#2dd4bf', bumper: '#34d399', accent: '#fbbf24' } },
            { name: "Castle", theme: { bg: '#2e1a0a', wall: '#b45309', bumper: '#fbbf24', accent: '#ef4444' } },
            { name: "Wave", theme: { bg: '#1e1b4b', wall: '#7c3aed', bumper: '#c084fc', accent: '#fb7185' } },
            { name: "Custom", theme: { bg: '#1a1a2e', wall: '#22d3ee', bumper: '#f472b6', accent: '#a78bfa' } },
            { name: "Climb", theme: { bg: '#0a1628', wall: '#4a90d9', bumper: '#22d3ee', accent: '#ff6688' } }
        ];

        const ELEMENT_COLORS = {
            normal: { ball: ['#fff', '#ccc', '#666'], name: 'Normal', icon: '' },
            hot: { ball: ['#fff', '#ff6644', '#cc2200'], name: 'Hot', icon: '🔥' },
            water: { ball: ['#fff', '#4488ff', '#0044cc'], name: 'Water', icon: '💧' },
            grass: { ball: ['#fff', '#44ff66', '#00aa22'], name: 'Grass', icon: '🌿' }
        };

        // Custom level editor state
        let editorMode = 'bumper';
        let isEditing = false;
        let customBumpers = [];
        let customFlippers = [];
        let customRamps = [];
        let customWalls = [];
        let currentDrawing = [];
        let isDrawing = false;
        let draggedBumper = null;
        let draggedFlipper = null;
        let draggedRamp = null;
        let customFlipperBodies = [];

        // Upper level state
        let isInUpperLevel = false;
        let upperLevelTimer = 0;
        const UPPER_LEVEL_DURATION = 5000;

        // Climb mode state
        let climbMode = {
            active: false,
            totalFloors: 5,
            highestFloor: 0,
            currentBallFloor: 0,
            elementalBall: 'normal',
            checkpointFlippers: [],
            dropTargets: [],
            kickbackLeft: null,
            kickbackRight: null,
            kickbackLeftActive: false,
            kickbackRightActive: false,
            ballSaveActive: false,
            ballSaveTimer: 0,
            ballSaveUsed: false,
            ballSaveGate: null,
            boostPads: [],
            spinners: [],
            iceBlocks: [],
            fireHazards: [],
            waterPools: [],
            powerUps: [],
            destructWalls: []
        };

        let currentLevel = 0;
        let gameState = {
            score: 0, highScore: parseInt(localStorage.getItem('pinballHighScore')) || 0,
            ballsRemaining: CONFIG.totalBalls, isPlaying: false, ballInPlay: false, ballLaunched: false
        };

        const engine = Engine.create({ gravity: { x: 0, y: 0.8 } });
        const world = engine.world;
        const canvas = document.getElementById('game-canvas');
        canvas.width = CONFIG.width;
        canvas.height = CONFIG.height;
        const ctx = canvas.getContext('2d');

        const CATEGORY = { WALL: 0x0001, BALL: 0x0002, FLIPPER: 0x0004, BUMPER: 0x0008, SENSOR: 0x0020 };

        let ball = null, leftFlipper = null, rightFlipper = null;
        let bumpers = [], particles = [];
        let plunger = { power: 0, charging: false };
        let plungerGate = null;
        let ballLaunchTime = 0;
        let boardExtended = false;
        let cameraY = 0;
        const keys = { left: false, right: false };

        function createCurvedWall(points, thickness, options) {
            const bodies = [];
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i], p2 = points[i + 1];
                const dx = p2.x - p1.x, dy = p2.y - p1.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);
                bodies.push(Bodies.rectangle((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, len + thickness, thickness, { ...options, angle }));
                if (i > 0) bodies.push(Bodies.circle(p1.x, p1.y, thickness / 2, options));
            }
            return bodies;
        }

        // Helper: get Y offset for a floor (floor 0 = bottom, floor N = higher up)
        function floorY(floor) {
            return -floor * CONFIG.height;
        }

        function createLevel() {
            const level = LEVELS[currentLevel];
            const W = CONFIG.width, H = CONFIG.height;
            const wallOpts = {
                isStatic: true, restitution: 0.3, friction: 0.0,
                render: { fillStyle: level.theme.wall },
                collisionFilter: { category: CATEGORY.WALL }
            };
            const walls = [];

            if (currentLevel === 6) {
                createClimbLevel(walls, wallOpts);
                Composite.add(world, walls);
                return;
            }

            // Left wall
            const leftWall = [
                { x: 20, y: 50 }, { x: 20, y: 540 },
                { x: 28, y: 560 }, { x: 50, y: 580 }
            ];
            walls.push(...createCurvedWall(leftWall, 14, wallOpts));

            // Right wall
            const rightWall = [
                { x: W - 50, y: 100 }, { x: W - 50, y: 545 },
                { x: W - 60, y: 565 }, { x: W - 75, y: 580 }
            ];
            walls.push(...createCurvedWall(rightWall, 14, wallOpts));

            // Plunger entrance curve
            const plungerEntrance = [
                { x: W - 50, y: 20 },
                { x: W - 20, y: 45 }, { x: W - 8, y: 70 }
            ];
            walls.push(...createCurvedWall(plungerEntrance, 16, wallOpts));

            if (boardExtended) {
                const extLeft = [{ x: 20, y: -650 }, { x: 20, y: 50 }];
                walls.push(...createCurvedWall(extLeft, 14, wallOpts));
                const extRight = [{ x: W - 50, y: -650 }, { x: W - 50, y: 100 }];
                walls.push(...createCurvedWall(extRight, 14, wallOpts));
                walls.push(Bodies.rectangle((20 + W - 50) / 2, -650, W - 70, 14, wallOpts));
            } else {
                walls.push(Bodies.rectangle((20 + W - 50) / 2, 30, W - 70, 14, wallOpts));
                Composite.add(world, Bodies.rectangle(W / 2 - 15, 10, W - 80, 16, {
                    isStatic: true, isSensor: true, label: 'top-exit',
                    render: { fillStyle: 'transparent' },
                    collisionFilter: { category: CATEGORY.SENSOR }
                }));
            }

            // Plunger lane
            walls.push(Bodies.rectangle(W - 8, H / 2 + 50, 10, H - 80, wallOpts));
            walls.push(Bodies.rectangle(W - 42, H - 55, 8, 110, wallOpts));
            walls.push(Bodies.rectangle(W - 25, H - 10, 40, 10, wallOpts));

            // Bottom guides
            const leftGuide = [{ x: 50, y: 580 }, { x: 70, y: 600 }, { x: 85, y: 625 }];
            walls.push(...createCurvedWall(leftGuide, 12, wallOpts));
            const rightGuide = [{ x: W - 75, y: 580 }, { x: W - 90, y: 600 }, { x: W - 105, y: 625 }];
            walls.push(...createCurvedWall(rightGuide, 12, wallOpts));

            // Level-specific elements
            if (currentLevel === 0) {
                createBumper(120, 180, 24);
                createBumper(200, 130, 28);
                createBumper(280, 180, 24);
                createBumper(160, 300, 22);
                createBumper(240, 300, 22);
                walls.push(Bodies.polygon(90, H - 180, 3, 30, { ...wallOpts, angle: Math.PI, restitution: 1.3, label: 'slingshot', render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.polygon(W - 110, H - 180, 3, 30, { ...wallOpts, angle: 0, restitution: 1.3, label: 'slingshot', render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 1) {
                const cx = 170, cy = 280;
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 - Math.PI/2;
                    const r = 50 + i * 18;
                    createBumper(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 18 + (i % 2) * 6);
                }
                walls.push(Bodies.rectangle(170, 280, 70, 10, { ...wallOpts, restitution: 0.8, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 2) {
                createBumper(180, 120, 24);
                createBumper(100, 200, 20);
                createBumper(260, 200, 20);
                createBumper(180, 280, 24);
                createBumper(100, 360, 20);
                createBumper(260, 360, 20);
                createBumper(180, 440, 24);
                walls.push(Bodies.rectangle(140, 200, 40, 8, { ...wallOpts, angle: 0.5, render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.rectangle(220, 200, 40, 8, { ...wallOpts, angle: -0.5, render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.rectangle(140, 360, 40, 8, { ...wallOpts, angle: -0.5, render: { fillStyle: level.theme.accent } }));
                walls.push(Bodies.rectangle(220, 360, 40, 8, { ...wallOpts, angle: 0.5, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 3) {
                createBumper(90, 160, 28);
                createBumper(180, 120, 32);
                createBumper(270, 160, 28);
                createBumper(135, 300, 24);
                createBumper(225, 300, 24);
                createBumper(180, 420, 26);
                for (let i = 0; i < 3; i++) {
                    walls.push(Bodies.rectangle(70 + i * 40, 230, 25, 10, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                    walls.push(Bodies.rectangle(210 + i * 40, 230, 25, 10, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                }
                walls.push(Bodies.rectangle(180, 200, 12, 45, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 4) {
                createBumper(90, 180, 22);
                createBumper(270, 220, 22);
                createBumper(130, 340, 24);
                createBumper(230, 400, 24);
                createBumper(170, 480, 20);
                const w1 = [{ x: 70, y: 270 }, { x: 110, y: 250 }, { x: 150, y: 270 }, { x: 190, y: 250 }, { x: 230, y: 270 }];
                walls.push(...createCurvedWall(w1, 8, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                const w2 = [{ x: 140, y: 430 }, { x: 180, y: 410 }, { x: 220, y: 430 }, { x: 260, y: 410 }, { x: 300, y: 430 }];
                walls.push(...createCurvedWall(w2, 8, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
            }
            else if (currentLevel === 5) {
                customBumpers.forEach(b => createBumper(b.x, b.y, b.radius));
                customWalls.forEach(wallPoints => {
                    if (wallPoints.length >= 2) {
                        walls.push(...createCurvedWall(wallPoints, 10, { ...wallOpts, render: { fillStyle: level.theme.accent } }));
                    }
                });
                customFlipperBodies = [];
                customFlippers.forEach(f => {
                    const flipperBody = createCustomFlipper(f.x, f.y, f.side);
                    customFlipperBodies.push(flipperBody);
                });
                customRamps.forEach(r => {
                    const ramp = Bodies.circle(r.x, r.y, 18, {
                        isStatic: true, isSensor: true, label: 'ramp',
                        render: { fillStyle: '#fbbf24' },
                        collisionFilter: { category: CATEGORY.BUMPER }
                    });
                    Composite.add(world, ramp);
                });
            }

            Composite.add(world, walls);
        }

        // ===== CLIMB MODE LEVEL GENERATION =====
        function createClimbLevel(walls, wallOpts) {
            const W = CONFIG.width, H = CONFIG.height;
            const cm = climbMode;
            cm.checkpointFlippers = [];
            cm.dropTargets = [];
            cm.spinners = [];
            cm.iceBlocks = [];
            cm.fireHazards = [];
            cm.waterPools = [];
            cm.powerUps = [];
            cm.destructWalls = [];

            // FLOOR 0 (base floor): standard pinball board with plunger
            // Y range: 0 to H (700)
            // Left wall for floor 0 - extends up to y=-40 to connect with floor 1 transition
            const leftWall0 = [
                { x: 20, y: -40 }, { x: 20, y: 540 },
                { x: 28, y: 560 }, { x: 50, y: 580 }
            ];
            walls.push(...createCurvedWall(leftWall0, 14, wallOpts));

            // Right wall for floor 0 - split to preserve plunger exit gap
            // Upper segment: closes gap between floors above the plunger entrance
            // Ends at y=0 (not y=15) to avoid overlapping the plunger entrance curve
            walls.push(...createCurvedWall([
                { x: W - 50, y: -40 }, { x: W - 50, y: 0 }
            ], 14, wallOpts));
            // Lower segment: main right wall from below plunger exit down to flipper guide
            const rightWall0 = [
                { x: W - 50, y: 100 }, { x: W - 50, y: 545 },
                { x: W - 60, y: 565 }, { x: W - 75, y: 580 }
            ];
            walls.push(...createCurvedWall(rightWall0, 14, wallOpts));

            // Plunger entrance curve
            walls.push(...createCurvedWall([
                { x: W - 50, y: 20 }, { x: W - 20, y: 45 }, { x: W - 8, y: 70 }
            ], 16, wallOpts));

            // Plunger lane walls
            walls.push(Bodies.rectangle(W - 8, H / 2 + 50, 10, H - 80, wallOpts));
            walls.push(Bodies.rectangle(W - 42, H - 55, 8, 110, wallOpts));
            walls.push(Bodies.rectangle(W - 25, H - 10, 40, 10, wallOpts));

            // Bottom guides for floor 0 - extend to flipper pivots to seal gaps
            walls.push(...createCurvedWall([{ x: 50, y: 580 }, { x: 70, y: 600 }, { x: 95, y: 625 }, { x: 122, y: 638 }], 12, wallOpts));
            walls.push(...createCurvedWall([{ x: W - 75, y: 580 }, { x: W - 90, y: 600 }, { x: W - 110, y: 620 }, { x: W - 125, y: 633 }], 12, wallOpts));

            // Floor 0 bumpers
            createBumper(150, 200, 24);
            createBumper(250, 200, 24);
            createBumper(200, 300, 26);

            // Slingshots on floor 0
            walls.push(Bodies.polygon(90, H - 180, 3, 30, { ...wallOpts, angle: Math.PI, restitution: 1.3, label: 'slingshot', render: { fillStyle: LEVELS[6].theme.accent } }));
            walls.push(Bodies.polygon(W - 110, H - 180, 3, 30, { ...wallOpts, angle: 0, restitution: 1.3, label: 'slingshot', render: { fillStyle: LEVELS[6].theme.accent } }));

            // Second row of paddles on floor 0 - mounted against side walls
            const upperFlipperY = H - 280;
            const ulf0 = createClimbFlipper(60, upperFlipperY, 'left', 0);
            const urf0 = createClimbFlipper(W - 85, upperFlipperY, 'right', 0);
            climbMode.checkpointFlippers.push({ floor: 0, left: ulf0, right: urf0 });

            // Kickbacks on floor 0 outlanes
            createKickbacks(walls, wallOpts);

            // Ball save sensor at bottom
            cm.ballSaveActive = true;
            cm.ballSaveTimer = 0;
            cm.ballSaveUsed = false;

            // Generate upper floors (1 through totalFloors-1)
            for (let floor = 1; floor < cm.totalFloors; floor++) {
                createClimbFloor(floor, walls, wallOpts);
            }

            // Breakable ceiling at highest floor
            const topY = floorY(cm.totalFloors - 1);
            const ceilY = topY + 30;
            const ceilLeft = 27;
            const ceilRight = W - 57;
            const ceilWidth = ceilRight - ceilLeft;
            const ceilPanelCount = 6;
            const ceilPanelW = (ceilWidth / ceilPanelCount) - 4;
            for (let i = 0; i < ceilPanelCount; i++) {
                const cx = ceilLeft + (ceilWidth / ceilPanelCount) * (i + 0.5);
                const ceilPanel = Bodies.rectangle(cx, ceilY, ceilPanelW, 14, {
                    isStatic: true, label: 'floor-panel',
                    restitution: 0.5,
                    render: { fillStyle: '#ffcc00' },
                    collisionFilter: { category: CATEGORY.BUMPER },
                    plugin: { floor: cm.totalFloors, hit: false, score: 500 }
                });
                Composite.add(world, ceilPanel);
                cm.dropTargets.push(ceilPanel);
            }
        }

        function createClimbFloor(floor, walls, wallOpts) {
            const W = CONFIG.width, H = CONFIG.height;
            const level = LEVELS[6];
            const baseY = floorY(floor); // top of this floor
            const bottomY = baseY + H; // bottom of this floor (= top of floor below)
            const difficulty = floor / (climbMode.totalFloors - 1); // 0 to 1

            // Side walls run nearly full floor height, leaving a narrow funnel at bottom
            const wallTopY = baseY + 50;
            const wallBottomY = bottomY - 40; // walls extend close to floor boundary
            walls.push(...createCurvedWall([
                { x: 20, y: wallTopY },
                { x: 20, y: wallBottomY }
            ], 14, wallOpts));

            // Right wall
            walls.push(...createCurvedWall([
                { x: W - 50, y: wallTopY },
                { x: W - 50, y: wallBottomY }
            ], 14, wallOpts));

            // Funnel guides narrow toward a central opening
            walls.push(...createCurvedWall([
                { x: 20, y: wallBottomY },
                { x: 50, y: wallBottomY + 25 },
                { x: 100, y: wallBottomY + 55 }
            ], 10, wallOpts));
            walls.push(...createCurvedWall([
                { x: W - 50, y: wallBottomY },
                { x: W - 80, y: wallBottomY + 25 },
                { x: W - 130, y: wallBottomY + 55 }
            ], 10, wallOpts));

            // Breakable floor panels across the opening - hit them to open passage
            const panelY = wallBottomY + 45;
            const panelCount = 4;
            const openLeft = 105;
            const openRight = W - 135;
            const openWidth = openRight - openLeft;
            const panelW = (openWidth / panelCount) - 3;
            for (let i = 0; i < panelCount; i++) {
                const px = openLeft + (openWidth / panelCount) * (i + 0.5);
                const panel = Bodies.rectangle(px, panelY, panelW, 10, {
                    isStatic: true, label: 'floor-panel',
                    restitution: 0.5,
                    render: { fillStyle: '#4a90d9' },
                    collisionFilter: { category: CATEGORY.BUMPER },
                    plugin: { floor, hit: false, score: 150 }
                });
                Composite.add(world, panel);
                climbMode.dropTargets.push(panel);
            }

            // Checkpoint paddles on this floor (lower pair)
            const flipperY = baseY + H - 100;
            const lf = createClimbFlipper(150, flipperY, 'left', floor);
            const rf = createClimbFlipper(W - 150, flipperY, 'right', floor);
            climbMode.checkpointFlippers.push({ floor, left: lf, right: rf });

            // Flipper guides for lower pair - extend to flipper pivots
            walls.push(...createCurvedWall([
                { x: 50, y: flipperY - 40 }, { x: 70, y: flipperY - 20 }, { x: 95, y: flipperY + 5 }, { x: 122, y: flipperY + 18 }
            ], 10, wallOpts));
            walls.push(...createCurvedWall([
                { x: W - 75, y: flipperY - 40 }, { x: W - 90, y: flipperY - 20 }, { x: W - 110, y: flipperY }, { x: W - 125, y: flipperY + 13 }
            ], 10, wallOpts));

            // Upper paddles on this floor - mounted against side walls
            const upperFlipY = baseY + H - 350;
            const ulf = createClimbFlipper(60, upperFlipY, 'left', floor);
            const urf = createClimbFlipper(W - 85, upperFlipY, 'right', floor);
            climbMode.checkpointFlippers.push({ floor, left: ulf, right: urf });

            // Floor content based on difficulty
            const contentY = baseY + 100;
            const midX = W / 2 - 15;

            // Bumpers - more on higher floors
            const numBumpers = 2 + Math.floor(difficulty * 4);
            const seed = floor * 137;
            for (let i = 0; i < numBumpers; i++) {
                const bx = 80 + ((seed + i * 97) % (W - 180));
                const by = contentY + 50 + ((seed + i * 53) % (H - 350));
                const br = 18 + (i % 3) * 4;
                createBumper(bx, by, br);
            }

            // Drop targets - appear from floor 2+
            if (floor >= 2) {
                const dtY = contentY + 80;
                const dtCount = 3 + Math.floor(difficulty * 2);
                const dtStartX = midX - (dtCount * 25) / 2;
                for (let i = 0; i < dtCount; i++) {
                    const dt = Bodies.rectangle(dtStartX + i * 25, dtY, 8, 25, {
                        isStatic: true, label: 'drop-target',
                        restitution: 0.5,
                        render: { fillStyle: '#ff6688' },
                        collisionFilter: { category: CATEGORY.BUMPER },
                        plugin: { hit: false, floor, index: i, score: 200 }
                    });
                    Composite.add(world, dt);
                    climbMode.dropTargets.push(dt);
                }
            }

            // Spinners - appear from floor 1+
            if (floor >= 1) {
                const spX = 80 + ((seed + 33) % (W - 180));
                const spY = contentY + 200;
                const spinner = Bodies.rectangle(spX, spY, 40, 4, {
                    isStatic: true, label: 'spinner',
                    restitution: 0.8,
                    render: { fillStyle: '#fbbf24' },
                    collisionFilter: { category: CATEGORY.BUMPER },
                    plugin: { angle: 0, floor, score: 25 }
                });
                Composite.add(world, spinner);
                climbMode.spinners.push(spinner);
            }

            // Elemental obstacles - appear from floor 2+
            if (floor >= 2) {
                const obstacleTypes = [];
                if (floor >= 2) obstacleTypes.push('ice');
                if (floor >= 4) obstacleTypes.push('fire');
                if (floor >= 6) obstacleTypes.push('water');

                obstacleTypes.forEach((type, idx) => {
                    const ox = 80 + ((seed + idx * 71 + 200) % (W - 180));
                    const oy = contentY + 150 + idx * 80;
                    if (type === 'ice') {
                        const ice = Bodies.rectangle(ox, oy, 50, 50, {
                            isStatic: true, label: 'ice-block',
                            render: { fillStyle: '#88ccff' },
                            collisionFilter: { category: CATEGORY.WALL },
                            plugin: { floor, type: 'ice' }
                        });
                        Composite.add(world, ice);
                        climbMode.iceBlocks.push(ice);
                    } else if (type === 'fire') {
                        const fire = Bodies.circle(ox, oy, 20, {
                            isStatic: true, label: 'fire-hazard',
                            restitution: 2.0,
                            render: { fillStyle: '#ff4422' },
                            collisionFilter: { category: CATEGORY.BUMPER },
                            plugin: { floor, type: 'fire', score: -50 }
                        });
                        Composite.add(world, fire);
                        climbMode.fireHazards.push(fire);
                    } else if (type === 'water') {
                        const water = Bodies.rectangle(ox, oy, 60, 15, {
                            isStatic: true, label: 'water-pool', isSensor: true,
                            render: { fillStyle: '#4488ff' },
                            collisionFilter: { category: CATEGORY.SENSOR },
                            plugin: { floor, type: 'water' }
                        });
                        Composite.add(world, water);
                        climbMode.waterPools.push(water);
                    }
                });
            }

            // Power-ups: elemental ball pickups (sometimes behind destructible walls)
            if (floor >= 1) {
                const puTypes = ['hot'];
                if (floor >= 3) puTypes.push('water');
                if (floor >= 5) puTypes.push('grass');
                const puType = puTypes[(seed + floor) % puTypes.length];
                const puX = 80 + ((seed + 500) % (W - 180));
                const puY = contentY + 300;

                // Sometimes behind a destructible wall
                if (floor >= 3 && floor % 2 === 0) {
                    const dw = Bodies.rectangle(puX, puY - 20, 50, 12, {
                        isStatic: true, label: 'destruct-wall',
                        render: { fillStyle: '#8B6914' },
                        collisionFilter: { category: CATEGORY.WALL },
                        plugin: { health: 3, floor }
                    });
                    Composite.add(world, dw);
                    climbMode.destructWalls.push(dw);
                }

                const pu = Bodies.circle(puX, puY, 12, {
                    isStatic: true, isSensor: true, label: 'power-up',
                    render: { fillStyle: ELEMENT_COLORS[puType].ball[1] },
                    collisionFilter: { category: CATEGORY.SENSOR },
                    plugin: { type: puType, floor, collected: false }
                });
                Composite.add(world, pu);
                climbMode.powerUps.push(pu);
            }
        }

        function createClimbFlipper(x, y, side, floor) {
            const isLeft = side === 'left';
            const pivotX = isLeft ? x - 25 : x + 25;
            const level = LEVELS[6];

            const flipper = Bodies.rectangle(x, y, 60, 12, {
                label: `climb-flipper-${side}`, density: 0.03, friction: 0.9, restitution: 0.1,
                chamfer: { radius: 6 },
                collisionFilter: { category: CATEGORY.FLIPPER },
                render: { fillStyle: level.theme.accent }
            });

            const pivot = Bodies.circle(pivotX, y, 5, { isStatic: true, render: { fillStyle: level.theme.accent } });
            const constraint = Constraint.create({
                bodyA: flipper, pointA: { x: isLeft ? -25 : 25, y: 0 },
                bodyB: pivot, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0
            });

            Composite.add(world, [flipper, pivot, constraint]);
            Body.setAngle(flipper, isLeft ? CONFIG.flipper.restAngle : -CONFIG.flipper.restAngle);
            return { flipper, pivot, constraint };
        }

        function createKickbacks(walls, wallOpts) {
            const W = CONFIG.width, H = CONFIG.height;
            // Left kickback - above the upper paddles
            const kbL = Bodies.rectangle(35, H - 380, 8, 40, {
                ...wallOpts, label: 'kickback-left',
                restitution: 2.0,
                render: { fillStyle: '#00ff88' }
            });
            walls.push(kbL);
            climbMode.kickbackLeft = kbL;
            climbMode.kickbackLeftActive = true;

            // Right kickback - above the upper paddles
            const kbR = Bodies.rectangle(W - 65, H - 380, 8, 40, {
                ...wallOpts, label: 'kickback-right',
                restitution: 2.0,
                render: { fillStyle: '#00ff88' }
            });
            walls.push(kbR);
            climbMode.kickbackRight = kbR;
            climbMode.kickbackRightActive = true;
        }

        function createBallSaveGate() {
            removeBallSaveGate();
            const H = CONFIG.height;
            // Spans full drain: from left wall (x=27) to past right guide (x=320), below flippers
            const gate = Bodies.rectangle(173, H - 10, 295, 8, {
                isStatic: true, label: 'ball-save-gate',
                restitution: 2.0,
                render: { fillStyle: '#00ff88' },
                collisionFilter: { category: CATEGORY.WALL }
            });
            Composite.add(world, gate);
            climbMode.ballSaveGate = gate;
        }

        function removeBallSaveGate() {
            if (climbMode.ballSaveGate) {
                Composite.remove(world, climbMode.ballSaveGate);
                climbMode.ballSaveGate = null;
            }
        }

        function createBoostPad(floor) {
            const W = CONFIG.width, H = CONFIG.height;
            const baseY = floorY(floor);
            const padY = baseY + 180;
            const pad = Bodies.rectangle(W / 2 - 15, padY, 80, 10, {
                isStatic: true, label: 'boost-pad',
                restitution: 3.0,
                render: { fillStyle: '#00ff88' },
                collisionFilter: { category: CATEGORY.BUMPER },
                plugin: { floor, score: 0, isFlashing: false }
            });
            Composite.add(world, pad);
            climbMode.boostPads.push(pad);
        }

        function createCustomFlipper(x, y, side) {
            const isLeft = side === 'left';
            const level = LEVELS[currentLevel];
            const pivotX = isLeft ? x - 20 : x + 20;
            const flipper = Bodies.rectangle(x, y, 50, 10, {
                label: `custom-flipper-${side}`, density: 0.03, friction: 0.9, restitution: 0.1,
                chamfer: { radius: 5 },
                collisionFilter: { category: CATEGORY.FLIPPER },
                render: { fillStyle: level.theme.accent }
            });
            const pivot = Bodies.circle(pivotX, y, 4, { isStatic: true, render: { fillStyle: level.theme.accent } });
            const constraint = Constraint.create({
                bodyA: flipper, pointA: { x: isLeft ? -20 : 20, y: 0 },
                bodyB: pivot, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0
            });
            Composite.add(world, [flipper, pivot, constraint]);
            Body.setAngle(flipper, isLeft ? 0.4 : -0.4);
            return { flipper, pivot, constraint, side };
        }

        // Editor functions
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CONFIG.width / rect.width;
            const scaleY = CONFIG.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY - cameraY };
        }

        function findBumperAt(x, y) {
            for (let i = customBumpers.length - 1; i >= 0; i--) {
                const b = customBumpers[i];
                if (Math.sqrt((b.x - x) ** 2 + (b.y - y) ** 2) < b.radius + 10) return i;
            }
            return -1;
        }

        function findFlipperAt(x, y) {
            for (let i = customFlippers.length - 1; i >= 0; i--) {
                const f = customFlippers[i];
                if (Math.sqrt((f.x - x) ** 2 + (f.y - y) ** 2) < 35) return i;
            }
            return -1;
        }

        function findRampAt(x, y) {
            for (let i = customRamps.length - 1; i >= 0; i--) {
                const r = customRamps[i];
                if (Math.sqrt((r.x - x) ** 2 + (r.y - y) ** 2) < 25) return i;
            }
            return -1;
        }

        function addCustomBumper(x, y) {
            if (x > CONFIG.width - 60 || x < 40 || y < 50 || y > CONFIG.height - 100) return;
            customBumpers.push({ x, y, radius: 22 + Math.random() * 8 });
            rebuildCustomLevel();
        }

        function addCustomFlipper(x, y) {
            if (x > CONFIG.width - 60 || x < 40 || y < 80 || y > CONFIG.height - 80) return;
            const side = x < CONFIG.width / 2 ? 'left' : 'right';
            customFlippers.push({ x, y, side });
            rebuildCustomLevel();
        }

        function addCustomRamp(x, y) {
            if (x > CONFIG.width - 60 || x < 40 || y < 80 || y > CONFIG.height - 150) return;
            customRamps.push({ x, y });
            rebuildCustomLevel();
        }

        function rebuildCustomLevel() {
            if (currentLevel !== 5) return;
            Composite.clear(world, false);
            bumpers = [];
            customFlipperBodies = [];
            createLevel();
            leftFlipper = createFlipper('left');
            rightFlipper = createFlipper('right');
            createDrainSensor();
            if (editorMode === 'play') createBall();
        }

        function startEditorDrawing(x, y) { if (editorMode !== 'wall') return; isDrawing = true; currentDrawing = [{ x, y }]; }
        function continueEditorDrawing(x, y) {
            if (!isDrawing || editorMode !== 'wall') return;
            const last = currentDrawing[currentDrawing.length - 1];
            if (Math.sqrt((last.x - x) ** 2 + (last.y - y) ** 2) > 15) currentDrawing.push({ x, y });
        }
        function finishEditorDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentDrawing.length >= 2) { customWalls.push([...currentDrawing]); rebuildCustomLevel(); }
            currentDrawing = [];
        }
        function clearCustomLevel() { customBumpers = []; customFlippers = []; customRamps = []; customWalls = []; rebuildCustomLevel(); }

        function setEditorMode(mode) {
            editorMode = mode;
            document.getElementById('bumper-mode-btn').classList.toggle('active', mode === 'bumper');
            document.getElementById('flipper-mode-btn').classList.toggle('active', mode === 'flipper');
            document.getElementById('ramp-mode-btn').classList.toggle('active', mode === 'ramp');
            document.getElementById('wall-mode-btn').classList.toggle('active', mode === 'wall');
            document.getElementById('play-test-btn').classList.toggle('active', mode === 'play');
            if (mode === 'play') {
                gameState.isPlaying = true; gameState.ballsRemaining = CONFIG.totalBalls;
                gameState.score = 0; isInUpperLevel = false;
                updateScoreDisplay(); updateBallsDisplay(); createBall();
                document.getElementById('editor-instructions').style.display = 'none';
            } else {
                gameState.isPlaying = false;
                if (ball) { Composite.remove(world, ball); ball = null; }
                document.getElementById('editor-instructions').style.display = 'block';
                const instructions = { 'bumper': 'Tap to place bumpers | Drag to move', 'flipper': 'Tap to place flippers | Left/Right side auto-detected', 'ramp': 'Tap to place ramps | Ball enters upper level', 'wall': 'Draw walls with your finger' };
                document.getElementById('editor-instructions').textContent = instructions[mode] || '';
            }
        }

        function createFlipper(side) {
            const isLeft = side === 'left';
            const x = isLeft ? 150 : CONFIG.width - 150;
            const y = CONFIG.height - 65;
            const pivotX = isLeft ? x - 25 : x + 25;
            const level = LEVELS[currentLevel];
            const flipper = Bodies.rectangle(x, y, 60, 12, {
                label: `flipper-${side}`, density: 0.03, friction: 0.9, restitution: 0.1,
                chamfer: { radius: 6 },
                collisionFilter: { category: CATEGORY.FLIPPER },
                render: { fillStyle: level.theme.accent }
            });
            const pivot = Bodies.circle(pivotX, y, 5, { isStatic: true, render: { fillStyle: level.theme.accent } });
            const constraint = Constraint.create({
                bodyA: flipper, pointA: { x: isLeft ? -25 : 25, y: 0 },
                bodyB: pivot, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0
            });
            Composite.add(world, [flipper, pivot, constraint]);
            Body.setAngle(flipper, isLeft ? CONFIG.flipper.restAngle : -CONFIG.flipper.restAngle);
            return { flipper, pivot, constraint };
        }

        function createBumper(x, y, radius) {
            const level = LEVELS[currentLevel];
            const bumper = Bodies.circle(x, y, radius, {
                isStatic: true, label: 'bumper', restitution: 3.0,
                render: { fillStyle: level.theme.bumper },
                collisionFilter: { category: CATEGORY.BUMPER },
                plugin: { score: 100, isFlashing: false }
            });
            Composite.add(world, bumper);
            bumpers.push(bumper);
        }

        function createDrainSensor() {
            Composite.add(world, Bodies.rectangle(CONFIG.width / 2, CONFIG.height + 30, CONFIG.width, 60, {
                isStatic: true, isSensor: true, label: 'drain',
                render: { fillStyle: 'transparent' },
                collisionFilter: { category: CATEGORY.SENSOR }
            }));
        }

        function removePlungerGate() {
            if (plungerGate) {
                Composite.remove(world, plungerGate);
                plungerGate = null;
            }
        }

        function createPlungerGate() {
            removePlungerGate();
            const W = CONFIG.width;
            // Seal the gap between y=15 and y=100 at x=W-50
            plungerGate = Bodies.rectangle(W - 50, 57, 14, 90, {
                isStatic: true, label: 'plunger-gate',
                render: { fillStyle: '#4a4a6a' },
                collisionFilter: { category: CATEGORY.WALL }
            });
            Composite.add(world, plungerGate);
        }

        function createBall() {
            if (ball) Composite.remove(world, ball);
            removePlungerGate();
            ball = Bodies.circle(CONFIG.width - 25, CONFIG.height - 50, CONFIG.ball.radius, {
                label: 'ball', restitution: CONFIG.ball.restitution,
                friction: CONFIG.ball.friction, frictionAir: CONFIG.ball.frictionAir,
                density: CONFIG.ball.density, render: { fillStyle: '#ddd' },
                collisionFilter: { category: CATEGORY.BALL, mask: CATEGORY.WALL | CATEGORY.FLIPPER | CATEGORY.BUMPER | CATEGORY.SENSOR }
            });
            Composite.add(world, ball);
            gameState.ballLaunched = false;
            gameState.ballInPlay = true;
            if (climbMode.active) {
                climbMode.elementalBall = 'normal';
                climbMode.ballSaveActive = true;
                climbMode.ballSaveTimer = Date.now();
                climbMode.ballSaveUsed = false;
                createBallSaveGate();
                updateClimbHUD();
            }
            document.getElementById('launch-indicator').style.display = 'block';
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { keys.left = true; e.preventDefault(); }
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { keys.right = true; e.preventDefault(); }
            if (e.key === ' ') { if (!gameState.ballLaunched && gameState.ballInPlay) plunger.charging = true; e.preventDefault(); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
            if (e.key === ' ') { if (plunger.charging && !gameState.ballLaunched) launchBall(); plunger.charging = false; }
        });

        const activeTouches = new Map();
        const gameContainer = document.getElementById('game-container');
        let launchTouchId = null, touchStartY = 0;

        function updateFlipperStates() {
            let l = false, r = false;
            activeTouches.forEach(s => { if (s === 'left') l = true; if (s === 'right') r = true; });
            keys.left = l; keys.right = r;
            document.getElementById('touch-left').classList.toggle('touch-active', l);
            document.getElementById('touch-right').classList.toggle('touch-active', r);
        }

        function isMenuVisible() {
            const ls = document.getElementById('level-select');
            const go = document.getElementById('game-over');
            return (ls && ls.style.display !== 'none') || (go && go.style.display !== 'none');
        }

        document.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            if (isMenuVisible()) return;
            if (isEditing && editorMode !== 'play') {
                const t = e.changedTouches[0];
                const coords = getCanvasCoords(t.clientX, t.clientY);
                const rect = canvas.getBoundingClientRect();
                if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                    if (editorMode === 'bumper') { const idx = findBumperAt(coords.x, coords.y); if (idx >= 0) draggedBumper = idx; else addCustomBumper(coords.x, coords.y); }
                    else if (editorMode === 'flipper') { const idx = findFlipperAt(coords.x, coords.y); if (idx >= 0) draggedFlipper = idx; else addCustomFlipper(coords.x, coords.y); }
                    else if (editorMode === 'ramp') { const idx = findRampAt(coords.x, coords.y); if (idx >= 0) draggedRamp = idx; else addCustomRamp(coords.x, coords.y); }
                    else if (editorMode === 'wall') startEditorDrawing(coords.x, coords.y);
                    e.preventDefault(); return;
                }
            }
            for (const t of e.changedTouches) {
                activeTouches.set(t.identifier, t.clientX < window.innerWidth / 2 ? 'left' : 'right');
                const rect = gameContainer.getBoundingClientRect();
                if (launchTouchId === null && !gameState.ballLaunched && gameState.ballInPlay &&
                    t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                    launchTouchId = t.identifier; touchStartY = t.clientY; plunger.charging = true;
                }
            }
            updateFlipperStates(); e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (isMenuVisible()) return;
            if (isEditing && editorMode !== 'play') {
                const t = e.changedTouches[0];
                const coords = getCanvasCoords(t.clientX, t.clientY);
                if (editorMode === 'bumper' && draggedBumper !== null) { customBumpers[draggedBumper].x = coords.x; customBumpers[draggedBumper].y = coords.y; rebuildCustomLevel(); }
                else if (editorMode === 'flipper' && draggedFlipper !== null) { customFlippers[draggedFlipper].x = coords.x; customFlippers[draggedFlipper].y = coords.y; customFlippers[draggedFlipper].side = coords.x < CONFIG.width / 2 ? 'left' : 'right'; rebuildCustomLevel(); }
                else if (editorMode === 'ramp' && draggedRamp !== null) { customRamps[draggedRamp].x = coords.x; customRamps[draggedRamp].y = coords.y; rebuildCustomLevel(); }
                else if (editorMode === 'wall') continueEditorDrawing(coords.x, coords.y);
                e.preventDefault(); return;
            }
            for (const t of e.changedTouches) if (activeTouches.has(t.identifier)) activeTouches.set(t.identifier, t.clientX < window.innerWidth / 2 ? 'left' : 'right');
            updateFlipperStates(); e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (isMenuVisible()) return;
            if (isEditing && editorMode !== 'play') { draggedBumper = null; draggedFlipper = null; draggedRamp = null; if (editorMode === 'wall') finishEditorDrawing(); }
            for (const t of e.changedTouches) {
                if (t.identifier === launchTouchId && plunger.charging) {
                    plunger.power = Math.max(0.6, Math.min((touchStartY - t.clientY) / 80, 1));
                    launchBall(); plunger.charging = false; launchTouchId = null;
                }
                activeTouches.delete(t.identifier);
            }
            updateFlipperStates();
        }, { passive: false });

        document.addEventListener('touchcancel', (e) => {
            if (isMenuVisible()) return;
            draggedBumper = null; draggedFlipper = null; draggedRamp = null; finishEditorDrawing();
            for (const t of e.changedTouches) { activeTouches.delete(t.identifier); if (t.identifier === launchTouchId) { plunger.charging = false; launchTouchId = null; } }
            updateFlipperStates();
        }, { passive: false });

        function launchBall() {
            if (!ball || gameState.ballLaunched) return;
            const power = Math.max(plunger.power, 0.7);
            Body.applyForce(ball, ball.position, { x: 0, y: -0.055 * power });
            gameState.ballLaunched = true; plunger.power = 0;
            ballLaunchTime = Date.now();
            document.getElementById('launch-indicator').style.display = 'none';
        }

        function updateFlippers() {
            if (!leftFlipper || !rightFlipper) return;
            const lTarget = keys.left ? CONFIG.flipper.activeAngle : CONFIG.flipper.restAngle;
            const rTarget = keys.right ? -CONFIG.flipper.activeAngle : -CONFIG.flipper.restAngle;
            Body.setAngularVelocity(leftFlipper.flipper, (lTarget - leftFlipper.flipper.angle) * 0.35);
            Body.setAngularVelocity(rightFlipper.flipper, (rTarget - rightFlipper.flipper.angle) * 0.35);

            // Update custom flippers
            customFlipperBodies.forEach(cf => {
                const isLeft = cf.side === 'left';
                const target = isLeft ? (keys.left ? -0.4 : 0.4) : (keys.right ? 0.4 : -0.4);
                Body.setAngularVelocity(cf.flipper, (target - cf.flipper.angle) * 0.35);
            });

            // Update climb mode checkpoint flippers
            if (climbMode.active) {
                climbMode.checkpointFlippers.forEach(cp => {
                    const lT = keys.left ? CONFIG.flipper.activeAngle : CONFIG.flipper.restAngle;
                    const rT = keys.right ? -CONFIG.flipper.activeAngle : -CONFIG.flipper.restAngle;
                    Body.setAngularVelocity(cp.left.flipper, (lT - cp.left.flipper.angle) * 0.35);
                    Body.setAngularVelocity(cp.right.flipper, (rT - cp.right.flipper.angle) * 0.35);
                });
            }
        }

        // Collisions
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(({ bodyA, bodyB }) => {
                const bumper = bodyA.label === 'bumper' ? bodyA : bodyB.label === 'bumper' ? bodyB : null;
                if (bumper && bumper.plugin) {
                    gameState.score += bumper.plugin.score;
                    updateScoreDisplay();
                    createScorePopup(bumper.position.x, bumper.position.y, bumper.plugin.score);
                    bumper.plugin.isFlashing = true;
                    setTimeout(() => bumper.plugin.isFlashing = false, 80);
                    createParticles(bumper.position.x, bumper.position.y, LEVELS[currentLevel].theme.bumper);
                    // Apply strong force push away from bumper center
                    if (ball) {
                        const dx = ball.position.x - bumper.position.x;
                        const dy = ball.position.y - bumper.position.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        Body.setVelocity(ball, {
                            x: (dx / dist) * 15,
                            y: (dy / dist) * 15
                        });
                    }
                }
                if (bodyA.label === 'slingshot' || bodyB.label === 'slingshot') {
                    gameState.score += 50; updateScoreDisplay();
                }

                // Ramp collision
                const ramp = bodyA.label === 'ramp' ? bodyA : bodyB.label === 'ramp' ? bodyB : null;
                const ballBody = bodyA.label === 'ball' ? bodyA : bodyB.label === 'ball' ? bodyB : null;
                if (ramp && ballBody && !isInUpperLevel && !boardExtended && !climbMode.active) {
                    enterUpperLevel(ramp.position.x);
                }

                // Top exit
                if ((bodyA.label === 'top-exit' || bodyB.label === 'top-exit') &&
                    (bodyA.label === 'ball' || bodyB.label === 'ball') &&
                    !isInUpperLevel && !boardExtended && !climbMode.active && ball && ball.velocity.y < -1) {
                    triggerTopTransition();
                }

                // Drop targets
                const dt = bodyA.label === 'drop-target' ? bodyA : bodyB.label === 'drop-target' ? bodyB : null;
                if (dt && dt.plugin && !dt.plugin.hit && (bodyA.label === 'ball' || bodyB.label === 'ball')) {
                    dt.plugin.hit = true;
                    dt.render.fillStyle = '#444';
                    Body.setPosition(dt, { x: dt.position.x, y: dt.position.y + 15 });
                    gameState.score += dt.plugin.score;
                    updateScoreDisplay();
                    createScorePopup(dt.position.x, dt.position.y, dt.plugin.score);
                    // Check if all targets on this floor are hit
                    const floorTargets = climbMode.dropTargets.filter(t => t.plugin.floor === dt.plugin.floor);
                    if (floorTargets.every(t => t.plugin.hit)) {
                        gameState.score += 1000;
                        updateScoreDisplay();
                        createScorePopup(dt.position.x, dt.position.y - 30, 1000);
                        // All targets cleared - create boost pad to help reach next floor
                        createBoostPad(dt.plugin.floor);
                    }
                }

                // Floor panels - breakable ceiling panels at floor transitions
                const fp = bodyA.label === 'floor-panel' ? bodyA : bodyB.label === 'floor-panel' ? bodyB : null;
                if (fp && fp.plugin && !fp.plugin.hit && (bodyA.label === 'ball' || bodyB.label === 'ball')) {
                    fp.plugin.hit = true;
                    gameState.score += fp.plugin.score;
                    updateScoreDisplay();
                    createScorePopup(fp.position.x, fp.position.y, fp.plugin.score);
                    const panelColor = fp.plugin.score >= 500 ? '#ffcc00' : '#4a90d9';
                    createParticles(fp.position.x, fp.position.y, panelColor);
                    Composite.remove(world, fp);
                }

                // Spinner
                const sp = bodyA.label === 'spinner' ? bodyA : bodyB.label === 'spinner' ? bodyB : null;
                if (sp && sp.plugin && (bodyA.label === 'ball' || bodyB.label === 'ball')) {
                    gameState.score += sp.plugin.score;
                    updateScoreDisplay();
                    sp.plugin.angle += 3;
                }

                // Fire hazard
                const fire = bodyA.label === 'fire-hazard' ? bodyA : bodyB.label === 'fire-hazard' ? bodyB : null;
                if (fire && (bodyA.label === 'ball' || bodyB.label === 'ball') && climbMode.active) {
                    if (climbMode.elementalBall === 'water') {
                        // Water extinguishes fire
                        Composite.remove(world, fire);
                        climbMode.fireHazards = climbMode.fireHazards.filter(f => f !== fire);
                        gameState.score += 500;
                        updateScoreDisplay();
                        createScorePopup(fire.position.x, fire.position.y, 500);
                        createParticles(fire.position.x, fire.position.y, '#4488ff');
                    } else {
                        // Fire damages - deflect ball downward
                        if (ball) Body.setVelocity(ball, { x: ball.velocity.x, y: Math.abs(ball.velocity.y) + 3 });
                        gameState.score = Math.max(0, gameState.score - 50);
                        updateScoreDisplay();
                    }
                }

                // Ice block
                const ice = bodyA.label === 'ice-block' ? bodyA : bodyB.label === 'ice-block' ? bodyB : null;
                if (ice && (bodyA.label === 'ball' || bodyB.label === 'ball') && climbMode.active) {
                    if (climbMode.elementalBall === 'hot') {
                        // Hot ball melts ice
                        Composite.remove(world, ice);
                        climbMode.iceBlocks = climbMode.iceBlocks.filter(b => b !== ice);
                        gameState.score += 300;
                        updateScoreDisplay();
                        createScorePopup(ice.position.x, ice.position.y, 300);
                        createParticles(ice.position.x, ice.position.y, '#ff6644');
                    }
                }

                // Water pool
                const wp = bodyA.label === 'water-pool' ? bodyA : bodyB.label === 'water-pool' ? bodyB : null;
                if (wp && (bodyA.label === 'ball' || bodyB.label === 'ball') && climbMode.active) {
                    if (climbMode.elementalBall === 'grass') {
                        // Grass soaks up water
                        Composite.remove(world, wp);
                        climbMode.waterPools = climbMode.waterPools.filter(w => w !== wp);
                        gameState.score += 300;
                        updateScoreDisplay();
                        createScorePopup(wp.position.x, wp.position.y, 300);
                        createParticles(wp.position.x, wp.position.y, '#44ff66');
                    } else {
                        // Water slows ball
                        if (ball) Body.setVelocity(ball, { x: ball.velocity.x * 0.5, y: ball.velocity.y * 0.5 });
                    }
                }

                // Power-up pickup
                const pu = bodyA.label === 'power-up' ? bodyA : bodyB.label === 'power-up' ? bodyB : null;
                if (pu && pu.plugin && !pu.plugin.collected && (bodyA.label === 'ball' || bodyB.label === 'ball') && climbMode.active) {
                    pu.plugin.collected = true;
                    climbMode.elementalBall = pu.plugin.type;
                    Composite.remove(world, pu);
                    climbMode.powerUps = climbMode.powerUps.filter(p => p !== pu);
                    gameState.score += 100;
                    updateScoreDisplay();
                    createScorePopup(pu.position.x, pu.position.y, 100);
                    createParticles(pu.position.x, pu.position.y, ELEMENT_COLORS[pu.plugin.type].ball[1]);
                    updateClimbHUD();
                }

                // Destructible wall
                const dw = bodyA.label === 'destruct-wall' ? bodyA : bodyB.label === 'destruct-wall' ? bodyB : null;
                if (dw && dw.plugin && (bodyA.label === 'ball' || bodyB.label === 'ball')) {
                    dw.plugin.health--;
                    if (dw.plugin.health <= 0) {
                        Composite.remove(world, dw);
                        climbMode.destructWalls = climbMode.destructWalls.filter(w => w !== dw);
                        createParticles(dw.position.x, dw.position.y, '#8B6914');
                    } else {
                        const alpha = Math.floor((dw.plugin.health / 3) * 255).toString(16).padStart(2, '0');
                        dw.render.fillStyle = '#8B6914' + alpha;
                    }
                }

                // Kickback deactivation
                if (climbMode.active) {
                    if ((bodyA === climbMode.kickbackLeft || bodyB === climbMode.kickbackLeft) &&
                        (bodyA.label === 'ball' || bodyB.label === 'ball') && climbMode.kickbackLeftActive) {
                        climbMode.kickbackLeftActive = false;
                        if (climbMode.kickbackLeft) climbMode.kickbackLeft.render.fillStyle = '#444';
                    }
                    if ((bodyA === climbMode.kickbackRight || bodyB === climbMode.kickbackRight) &&
                        (bodyA.label === 'ball' || bodyB.label === 'ball') && climbMode.kickbackRightActive) {
                        climbMode.kickbackRightActive = false;
                        if (climbMode.kickbackRight) climbMode.kickbackRight.render.fillStyle = '#444';
                    }
                }

                // Drain
                if ((bodyA.label === 'drain' || bodyB.label === 'drain') && (bodyA.label === 'ball' || bodyB.label === 'ball')) {
                    if (climbMode.active) removeBallSaveGate();
                    gameState.ballInPlay = false; gameState.ballsRemaining--;
                    updateBallsDisplay();
                    if (gameState.ballsRemaining <= 0) endGame(); else setTimeout(createBall, 800);
                }
            });
        });

        // Upper level functions (for non-climb modes)
        function enterUpperLevel(rampX) {
            if (!ball || isInUpperLevel) return;
            isInUpperLevel = true;
            upperLevelTimer = Date.now();
            gameState.score += 500; updateScoreDisplay();
            createScorePopup(rampX, 100, 500);
            Body.setPosition(ball, { x: rampX, y: -50 });
            Body.setVelocity(ball, { x: (Math.random() - 0.5) * 5, y: 2 });
        }

        function updateUpperLevel() {
            if (!isInUpperLevel || !ball) return;
            const elapsed = Date.now() - upperLevelTimer;
            if (ball.position.y < -20) {
                if (ball.position.x < 30) Body.setVelocity(ball, { x: Math.abs(ball.velocity.x) + 2, y: ball.velocity.y });
                if (ball.position.x > CONFIG.width - 30) Body.setVelocity(ball, { x: -Math.abs(ball.velocity.x) - 2, y: ball.velocity.y });
                if (ball.position.y < -100) Body.setVelocity(ball, { x: ball.velocity.x, y: Math.abs(ball.velocity.y) + 1 });
            }
            if (elapsed > UPPER_LEVEL_DURATION) exitUpperLevel();
        }

        function exitUpperLevel() {
            if (!ball) return;
            isInUpperLevel = false;
            const dropX = 100 + Math.random() * (CONFIG.width - 200);
            Body.setPosition(ball, { x: dropX, y: 50 });
            Body.setVelocity(ball, { x: (Math.random() - 0.5) * 3, y: 3 });
            gameState.score += 250; updateScoreDisplay();
            createScorePopup(dropX, 80, 250);
        }

        function triggerTopTransition() {
            if (!ball || !gameState.isPlaying || !gameState.ballInPlay || isInUpperLevel) return;
            if (Date.now() - ballLaunchTime < 3000) return;
            enterUpperLevel(ball.position.x);
        }

        function checkTopTransition() {
            if (!ball || !gameState.isPlaying || !gameState.ballInPlay || isInUpperLevel) return;
            if (ball.position.y < -10) triggerTopTransition();
        }

        // Climb mode updates
        function updateClimbMode() {
            if (!climbMode.active || !ball || !gameState.isPlaying) return;

            // Track which floor the ball is on
            const ballFloor = Math.max(0, Math.floor(-ball.position.y / CONFIG.height + 1));
            const actualFloor = ball.position.y > 0 ? 0 : ballFloor;
            climbMode.currentBallFloor = actualFloor;

            if (actualFloor > climbMode.highestFloor) {
                climbMode.highestFloor = actualFloor;
                gameState.score += 500 * actualFloor;
                updateScoreDisplay();
                createScorePopup(ball.position.x, ball.position.y, 500 * actualFloor);
                // New floor reached - renew ball save
                climbMode.ballSaveActive = true;
                climbMode.ballSaveTimer = Date.now();
                climbMode.ballSaveUsed = false;
                createBallSaveGate();
            }

            // Remove ball save gate when timer expires
            if (climbMode.ballSaveActive && !climbMode.ballSaveUsed &&
                climbMode.ballSaveTimer > 0 && (Date.now() - climbMode.ballSaveTimer >= 10000)) {
                climbMode.ballSaveActive = false;
                removeBallSaveGate();
            }
            // Fade gate color as time runs out
            if (climbMode.ballSaveGate && climbMode.ballSaveTimer > 0) {
                const remaining = Math.max(0, 10000 - (Date.now() - climbMode.ballSaveTimer));
                const alpha = remaining / 10000;
                const g = Math.floor(255 * alpha);
                climbMode.ballSaveGate.render.fillStyle = `rgb(0,${g},${Math.floor(136 * alpha)})`;
            }

            updateClimbHUD();

            // Animate spinners
            climbMode.spinners.forEach(sp => {
                if (sp.plugin) {
                    sp.plugin.angle += 0.02;
                    Body.setAngle(sp, sp.plugin.angle);
                }
            });
        }

        function updateClimbHUD() {
            if (!climbMode.active) return;
            document.getElementById('floor-num').textContent = climbMode.currentBallFloor + 1;
            document.getElementById('floor-total').textContent = climbMode.totalFloors;
            const elem = climbMode.elementalBall;
            const elemInfo = ELEMENT_COLORS[elem];
            document.getElementById('element-display').innerHTML =
                elem === 'normal' ? '<span style="color:#888">Normal Ball</span>' :
                `<span style="color:${elemInfo.ball[1]}">${elemInfo.icon} ${elemInfo.name} Ball</span>`;
        }

        function updateScoreDisplay() { document.querySelector('#current-score .score-value').textContent = gameState.score.toLocaleString(); }
        function updateBallsDisplay() { document.querySelector('#balls-left .score-value').textContent = gameState.ballsRemaining; }
        function updateHighScore() {
            if (gameState.score > gameState.highScore) { gameState.highScore = gameState.score; localStorage.setItem('pinballHighScore', gameState.highScore); }
            document.querySelector('#high-score .score-value').textContent = gameState.highScore.toLocaleString();
        }

        function createScorePopup(x, y, pts) {
            const p = document.createElement('div'); p.className = 'score-popup'; p.textContent = '+' + pts;
            const r = canvas.getBoundingClientRect();
            const s = r.width / CONFIG.width;
            p.style.left = (r.left + x * s) + 'px'; p.style.top = (r.top + (y + cameraY) * s) + 'px';
            document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1, color, size: Math.random() * 4 + 2 });
        }

        function updateParticles() {
            particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.025; return p.life > 0; });
        }

        // Camera follow
        function updateCamera() {
            if (climbMode.active && ball && gameState.isPlaying) {
                // Camera follows ball through all floors
                const targetCam = Math.max(0, -(ball.position.y - CONFIG.height / 2));
                cameraY += (targetCam - cameraY) * 0.08;
                return;
            }
            if (!boardExtended || !ball || !gameState.isPlaying) {
                cameraY += (0 - cameraY) * 0.1;
                return;
            }
            const targetCam = Math.max(0, Math.min(CONFIG.height, -(ball.position.y - CONFIG.height / 2)));
            cameraY += (targetCam - cameraY) * 0.08;
        }

        // Render
        function render() {
            const level = LEVELS[currentLevel];
            const W = CONFIG.width, H = CONFIG.height;

            ctx.save();
            ctx.translate(0, cameraY);

            // Background
            ctx.fillStyle = level.theme.bg;
            if (climbMode.active) {
                // Draw backgrounds for all floors
                for (let f = climbMode.totalFloors - 1; f >= 0; f--) {
                    const fy = floorY(f);
                    ctx.fillStyle = level.theme.bg;
                    ctx.fillRect(0, fy, W, H);
                    // Floor divider line
                    if (f > 0) {
                        ctx.strokeStyle = level.theme.wall + '40';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([6, 4]);
                        ctx.beginPath();
                        ctx.moveTo(30, fy + H);
                        ctx.lineTo(W - 60, fy + H);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        // Floor number label
                        ctx.fillStyle = level.theme.wall + '30';
                        ctx.font = 'bold 60px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(f + 1, W / 2 - 15, fy + H / 2 + 20);
                    }
                }
            } else if (boardExtended) {
                ctx.fillRect(0, -H, W, H);
                ctx.strokeStyle = level.theme.wall + '60';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                ctx.moveTo(30, 0);
                ctx.lineTo(W - 60, 0);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = level.theme.wall + '40';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('TABLE 2', W / 2 - 15, -320);
            }
            ctx.fillStyle = level.theme.bg;
            ctx.fillRect(0, 0, W, H);

            // Draw all physics bodies
            Composite.allBodies(world).forEach(body => {
                if (body.render.fillStyle === 'transparent') return;
                ctx.beginPath();
                let fill = body.render.fillStyle;
                if (body.plugin?.isFlashing) fill = '#fff';
                ctx.fillStyle = fill;

                if (body.circleRadius) {
                    ctx.arc(body.position.x, body.position.y, body.circleRadius, 0, Math.PI * 2);
                } else {
                    const v = body.vertices;
                    ctx.moveTo(v[0].x, v[0].y);
                    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
                    ctx.closePath();
                }
                ctx.fill();

                if (body.label === 'bumper') {
                    ctx.shadowColor = level.theme.bumper; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, body.circleRadius * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = body.plugin?.isFlashing ? '#fff' : level.theme.bg; ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('100', body.position.x, body.position.y);
                }

                // Elemental ball rendering
                if (body.label === 'ball') {
                    const colors = climbMode.active ? ELEMENT_COLORS[climbMode.elementalBall].ball : ['#fff', '#ccc', '#666'];
