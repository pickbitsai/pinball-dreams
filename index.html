                    const g = ctx.createRadialGradient(body.position.x - 3, body.position.y - 3, 0, body.position.x, body.position.y, body.circleRadius);
                    g.addColorStop(0, colors[0]); g.addColorStop(0.4, colors[1]); g.addColorStop(1, colors[2]);
                    ctx.fillStyle = g; ctx.fill();
                    ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.stroke();
                    // Elemental glow
                    if (climbMode.active && climbMode.elementalBall !== 'normal') {
                        ctx.shadowColor = colors[1]; ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(body.position.x, body.position.y, body.circleRadius + 2, 0, Math.PI * 2);
                        ctx.strokeStyle = colors[1] + '80'; ctx.lineWidth = 2; ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }

                // Ice block special rendering
                if (body.label === 'ice-block') {
                    ctx.shadowColor = '#88ccff'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#aaddff'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('ICE', body.position.x, body.position.y);
                }

                // Fire hazard special rendering
                if (body.label === 'fire-hazard') {
                    ctx.shadowColor = '#ff4422'; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('🔥', body.position.x, body.position.y);
                }

                // Water pool rendering
                if (body.label === 'water-pool') {
                    ctx.fillStyle = '#4488ff40';
                    ctx.fillRect(body.position.x - 30, body.position.y - 7, 60, 15);
                    ctx.strokeStyle = '#4488ff'; ctx.lineWidth = 1;
                    ctx.strokeRect(body.position.x - 30, body.position.y - 7, 60, 15);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('WATER', body.position.x, body.position.y);
                }

                // Drop target rendering
                if (body.label === 'drop-target' && body.plugin) {
                    if (!body.plugin.hit) {
                        ctx.shadowColor = '#ff6688'; ctx.shadowBlur = 5; ctx.fill(); ctx.shadowBlur = 0;
                    }
                }

                // Floor panel rendering
                if (body.label === 'floor-panel' && body.plugin && !body.plugin.hit) {
                    const isCeiling = body.plugin.score >= 500;
                    ctx.shadowColor = isCeiling ? '#ffcc00' : '#4a90d9';
                    ctx.shadowBlur = isCeiling ? 12 : 8; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.strokeStyle = isCeiling ? '#ffe066' : '#6ab0ff';
                    ctx.lineWidth = isCeiling ? 2 : 1; ctx.stroke();
                }

                // Spinner rendering
                if (body.label === 'spinner') {
                    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 5; ctx.fill(); ctx.shadowBlur = 0;
                }

                // Ball save gate glow
                if (body.label === 'ball-save-gate') {
                    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('SAVE', body.position.x, body.position.y);
                }

                // Boost pad glow
                if (body.label === 'boost-pad') {
                    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('BOOST', body.position.x, body.position.y);
                }

                // Power-up rendering
                if (body.label === 'power-up' && body.plugin && !body.plugin.collected) {
                    const puColor = ELEMENT_COLORS[body.plugin.type].ball[1];
                    ctx.shadowColor = puColor; ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, 12, 0, Math.PI * 2);
                    ctx.fillStyle = puColor; ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(ELEMENT_COLORS[body.plugin.type].icon, body.position.x, body.position.y);
                }
            });

            // Flipper pivots
            if (leftFlipper && rightFlipper) {
                [leftFlipper.pivot, rightFlipper.pivot].forEach(p => {
                    ctx.beginPath(); ctx.arc(p.position.x, p.position.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = level.theme.accent; ctx.shadowColor = level.theme.accent; ctx.shadowBlur = 10;
                    ctx.fill(); ctx.shadowBlur = 0;
                });
            }

            // Climb flipper pivots
            if (climbMode.active) {
                climbMode.checkpointFlippers.forEach(cp => {
                    [cp.left.pivot, cp.right.pivot].forEach(p => {
                        ctx.beginPath(); ctx.arc(p.position.x, p.position.y, 5, 0, Math.PI * 2);
                        ctx.fillStyle = level.theme.accent; ctx.shadowColor = level.theme.accent; ctx.shadowBlur = 8;
                        ctx.fill(); ctx.shadowBlur = 0;
                    });
                });
            }

            // Particles
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill(); ctx.globalAlpha = 1;
            });

            // Plunger lane visual
            ctx.fillStyle = level.theme.wall + '80';
            ctx.fillRect(CONFIG.width - 38, CONFIG.height - 110, 26, 100);
            const offset = plunger.charging ? plunger.power * 20 : 0;
            ctx.fillStyle = level.theme.accent;
            ctx.beginPath(); ctx.arc(CONFIG.width - 25, CONFIG.height - 20 + offset, 10, 0, Math.PI * 2); ctx.fill();
            if (plunger.charging) {
                plunger.power = Math.min(plunger.power + 0.03, 1);
                ctx.fillStyle = `rgba(0,255,136,${plunger.power})`;
                ctx.fillRect(CONFIG.width - 36, CONFIG.height - 105, 22 * plunger.power, 5);
            }
            if (!gameState.ballLaunched && gameState.ballInPlay) {
                ctx.fillStyle = 'rgba(0,255,136,0.15)';
                ctx.fillRect(CONFIG.width - 38, CONFIG.height - 110, 26, 90);
            }

            // Editor drawing
            if (isEditing && isDrawing && currentDrawing.length > 0) {
                ctx.beginPath(); ctx.strokeStyle = level.theme.accent; ctx.lineWidth = 10;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.moveTo(currentDrawing[0].x, currentDrawing[0].y);
                for (let i = 1; i < currentDrawing.length; i++) ctx.lineTo(currentDrawing[i].x, currentDrawing[i].y);
                ctx.stroke();
            }
            if (isEditing && !gameState.isPlaying) {
                ctx.fillStyle = 'rgba(244, 114, 182, 0.2)'; ctx.strokeStyle = 'rgba(244, 114, 182, 0.5)';
                ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
                ctx.beginPath(); ctx.rect(40, 50, CONFIG.width - 100, CONFIG.height - 150); ctx.stroke(); ctx.setLineDash([]);
            }

            // Ramps
            customRamps.forEach(r => {
                ctx.beginPath(); ctx.arc(r.x, r.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = '#1a1a2e'; ctx.beginPath();
                ctx.moveTo(r.x, r.y - 8); ctx.lineTo(r.x - 6, r.y + 4); ctx.lineTo(r.x + 6, r.y + 4);
                ctx.closePath(); ctx.fill();
            });

            ctx.restore();

            // HUD (fixed position, not affected by camera)
            if (isInUpperLevel && gameState.isPlaying && !boardExtended && !climbMode.active) {
                const elapsed = Date.now() - upperLevelTimer;
                const remaining = Math.max(0, UPPER_LEVEL_DURATION - elapsed);
                const progress = remaining / UPPER_LEVEL_DURATION;
                ctx.fillStyle = 'rgba(251, 191, 36, 0.9)'; ctx.fillRect(0, 0, CONFIG.width, 40);
                ctx.fillStyle = '#1a1a2e'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                ctx.fillText('TABLE 2!', CONFIG.width / 2, 25);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(20, 32, CONFIG.width - 40, 5);
                ctx.fillStyle = '#00ff88'; ctx.fillRect(20, 32, (CONFIG.width - 40) * progress, 5);
            }
        }

        function gameLoop() {
            if (gameState.isPlaying) {
                updateFlippers();
                // Close plunger lane after ball exits well into playfield
                if (ball && gameState.ballLaunched && !plungerGate && ball.position.x < CONFIG.width - 120 && ball.position.y > 80) {
                    createPlungerGate();
                }
                if (climbMode.active) {
                    updateClimbMode();
                } else if (!boardExtended) {
                    updateUpperLevel();
                    checkTopTransition();
                }
                Engine.update(engine, 1000 / 60);
                updateParticles();
            }
            updateCamera();
            render();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState.score = 0; gameState.ballsRemaining = CONFIG.totalBalls;
            gameState.isPlaying = true; gameState.ballInPlay = false;
            isInUpperLevel = false;

            if (currentLevel === 6) {
                // Climb mode
                climbMode.active = true;
                climbMode.totalFloors = 5;
                climbMode.highestFloor = 0;
                climbMode.currentBallFloor = 0;
                climbMode.elementalBall = 'normal';
                climbMode.ballSaveGate = null;
                climbMode.boostPads = [];
                boardExtended = false;
                cameraY = 0;
                document.getElementById('climb-hud').style.display = 'block';
            } else {
                climbMode.active = false;
                document.getElementById('climb-hud').style.display = 'none';
                if (currentLevel !== 5) { boardExtended = false; cameraY = 0; }
            }

            Composite.clear(world, false); bumpers = []; particles = [];
            createLevel();
            leftFlipper = createFlipper('left'); rightFlipper = createFlipper('right');
            createDrainSensor(); createBall();
            updateScoreDisplay(); updateBallsDisplay(); updateHighScore();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('menu-btn').style.display = 'block';
            document.getElementById('level-name-display').textContent = LEVELS[currentLevel].name;
            document.getElementById('ball-save-indicator').style.display = 'none';
        }

        function endGame() {
            gameState.isPlaying = false; updateHighScore();
            document.getElementById('final-score').textContent = gameState.score.toLocaleString();
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('menu-btn').style.display = 'none';
            document.getElementById('climb-hud').style.display = 'none';
            document.getElementById('ball-save-indicator').style.display = 'none';
            if (climbMode.active) {
                document.getElementById('final-floor').style.display = 'block';
                document.getElementById('final-floor-num').textContent = climbMode.highestFloor + 1;
            } else {
                document.getElementById('final-floor').style.display = 'none';
            }
            climbMode.active = false;
        }

        function showLevelSelect() {
            gameState.isPlaying = false;
            boardExtended = false; cameraY = 0;
            climbMode.active = false;
            Composite.clear(world, false);
            document.getElementById('level-select').style.display = 'block';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu-btn').style.display = 'none';
            document.getElementById('editor-controls').style.display = 'none';
            document.getElementById('climb-hud').style.display = 'none';
            document.getElementById('ball-save-indicator').style.display = 'none';
        }

        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected'); currentLevel = parseInt(btn.dataset.level);
            });
        });
        document.getElementById('play-btn').addEventListener('click', () => {
            if (currentLevel === 5) startCustomEditor();
            else startGame();
        });
        document.getElementById('restart-btn').addEventListener('click', showLevelSelect);
        document.getElementById('menu-btn').addEventListener('click', () => {
            isEditing = false;
            document.getElementById('editor-controls').style.display = 'none';
            document.getElementById('editor-instructions').style.display = 'none';
            showLevelSelect();
        });

        // Editor button listeners
        document.getElementById('bumper-mode-btn').addEventListener('click', () => setEditorMode('bumper'));
        document.getElementById('flipper-mode-btn').addEventListener('click', () => setEditorMode('flipper'));
        document.getElementById('ramp-mode-btn').addEventListener('click', () => setEditorMode('ramp'));
        document.getElementById('wall-mode-btn').addEventListener('click', () => setEditorMode('wall'));
        document.getElementById('play-test-btn').addEventListener('click', () => setEditorMode('play'));
        document.getElementById('clear-btn').addEventListener('click', clearCustomLevel);
        document.getElementById('extend-btn').addEventListener('click', () => {
            boardExtended = !boardExtended;
            document.getElementById('extend-btn').classList.toggle('active', boardExtended);
            document.getElementById('extend-btn').textContent = boardExtended ? 'Extended' : 'Extend';
            cameraY = 0; rebuildCustomLevel();
        });

        function startCustomEditor() {
            isEditing = true; editorMode = 'bumper';
            gameState.score = 0; gameState.ballsRemaining = CONFIG.totalBalls;
            gameState.isPlaying = false; gameState.ballInPlay = false;
            Composite.clear(world, false); bumpers = []; particles = [];
            createLevel();
            leftFlipper = createFlipper('left'); rightFlipper = createFlipper('right');
            createDrainSensor();
            updateScoreDisplay(); updateBallsDisplay();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('level-select').style.display = 'none';
            document.getElementById('menu-btn').style.display = 'block';
            document.getElementById('editor-controls').style.display = 'flex';
            document.getElementById('editor-instructions').style.display = 'block';
            document.getElementById('level-name-display').textContent = 'Custom Editor';
            document.getElementById('extend-btn').classList.toggle('active', boardExtended);
            document.getElementById('extend-btn').textContent = boardExtended ? 'Extended' : 'Extend';
            setEditorMode('bumper');
        }

        // Mouse support for desktop editing
        canvas.addEventListener('mousedown', (e) => {
            if (!isEditing || editorMode === 'play') return;
            const coords = getCanvasCoords(e.clientX, e.clientY);
            if (editorMode === 'bumper') { const idx = findBumperAt(coords.x, coords.y); if (idx >= 0) draggedBumper = idx; else addCustomBumper(coords.x, coords.y); }
            else if (editorMode === 'flipper') { const idx = findFlipperAt(coords.x, coords.y); if (idx >= 0) draggedFlipper = idx; else addCustomFlipper(coords.x, coords.y); }
            else if (editorMode === 'ramp') { const idx = findRampAt(coords.x, coords.y); if (idx >= 0) draggedRamp = idx; else addCustomRamp(coords.x, coords.y); }
            else if (editorMode === 'wall') startEditorDrawing(coords.x, coords.y);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isEditing || editorMode === 'play') return;
            const coords = getCanvasCoords(e.clientX, e.clientY);
            if (editorMode === 'bumper' && draggedBumper !== null) { customBumpers[draggedBumper].x = coords.x; customBumpers[draggedBumper].y = coords.y; rebuildCustomLevel(); }
            else if (editorMode === 'flipper' && draggedFlipper !== null) { customFlippers[draggedFlipper].x = coords.x; customFlippers[draggedFlipper].y = coords.y; customFlippers[draggedFlipper].side = coords.x < CONFIG.width / 2 ? 'left' : 'right'; rebuildCustomLevel(); }
            else if (editorMode === 'ramp' && draggedRamp !== null) { customRamps[draggedRamp].x = coords.x; customRamps[draggedRamp].y = coords.y; rebuildCustomLevel(); }
            else if (editorMode === 'wall') continueEditorDrawing(coords.x, coords.y);
        });
        canvas.addEventListener('mouseup', () => { if (!isEditing || editorMode === 'play') return; draggedBumper = null; draggedFlipper = null; draggedRamp = null; finishEditorDrawing(); });
        canvas.addEventListener('mouseleave', () => { draggedBumper = null; draggedFlipper = null; draggedRamp = null; finishEditorDrawing(); });

        function handleResize() {
            const scale = Math.min((window.innerWidth - 20) / CONFIG.width, (window.innerHeight - 120) / CONFIG.height, 1);
            canvas.style.transform = `scale(${scale})`; canvas.style.transformOrigin = 'top center';
        }
        window.addEventListener('resize', handleResize); handleResize();

        window.onload = () => { updateHighScore(); document.getElementById('level-select').style.display = 'block'; gameLoop(); };
    </script>
</body>
</html>
